<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#020617"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1100" height="650" fill="url(#bg)"/>
  <rect width="1100" height="650" fill="url(#grid)"/>

  <text x="550" y="38" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle">Modulos Funcionales — Proyectos Sonepar</text>
  <text x="550" y="56" fill="#94a3b8" font-size="11" text-anchor="middle">7 modulos + Auth + Routing | SPA React 19</text>

  <!-- Central hub: App -->
  <circle cx="550" cy="300" r="70" fill="rgba(8, 51, 68, 0.3)" stroke="#22d3ee" stroke-width="2"/>
  <text x="550" y="290" fill="white" font-size="14" font-weight="700" text-anchor="middle">App</text>
  <text x="550" y="308" fill="#94a3b8" font-size="9" text-anchor="middle">React Router v7</text>
  <text x="550" y="322" fill="#22d3ee" font-size="8" text-anchor="middle">Layout Principal</text>

  <!-- Auth module (top) -->
  <rect x="470" y="80" width="160" height="70" rx="8" fill="rgba(136, 19, 55, 0.3)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="550" y="105" fill="white" font-size="12" font-weight="700" text-anchor="middle">Autenticacion</text>
  <text x="550" y="122" fill="#94a3b8" font-size="9" text-anchor="middle">Firebase Auth</text>
  <text x="550" y="137" fill="#fb7185" font-size="8" text-anchor="middle">/login + Protected Routes</text>

  <!-- Module 1: Fichas Tecnicas (top-left) -->
  <rect x="100" y="110" width="180" height="90" rx="8" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="190" y="135" fill="white" font-size="12" font-weight="700" text-anchor="middle">Fichas Tecnicas</text>
  <text x="190" y="152" fill="#94a3b8" font-size="9" text-anchor="middle">400K+ productos</text>
  <text x="190" y="167" fill="#94a3b8" font-size="8" text-anchor="middle">Navegacion por familia</text>
  <text x="190" y="182" fill="#94a3b8" font-size="8" text-anchor="middle">Busqueda + filtros + detalle</text>
  <text x="190" y="195" fill="#22d3ee" font-size="8" text-anchor="middle">/fichas-tecnicas/*</text>

  <!-- Module 2: Simulador Almacen (left) -->
  <rect x="60" y="250" width="180" height="90" rx="8" fill="rgba(76, 29, 149, 0.3)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="150" y="275" fill="white" font-size="12" font-weight="700" text-anchor="middle">Sim. Almacen</text>
  <text x="150" y="292" fill="#94a3b8" font-size="9" text-anchor="middle">Gestion de stock</text>
  <text x="150" y="307" fill="#94a3b8" font-size="8" text-anchor="middle">Entradas / Salidas</text>
  <text x="150" y="322" fill="#94a3b8" font-size="8" text-anchor="middle">Niveles minimos + alertas</text>
  <text x="150" y="335" fill="#a78bfa" font-size="8" text-anchor="middle">/simulador-almacen</text>

  <!-- Module 3: Incidencias (bottom-left) -->
  <rect x="100" y="400" width="180" height="90" rx="8" fill="rgba(136, 19, 55, 0.25)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="190" y="425" fill="white" font-size="12" font-weight="700" text-anchor="middle">Incidencias</text>
  <text x="190" y="442" fill="#94a3b8" font-size="9" text-anchor="middle">Registro de fallos</text>
  <text x="190" y="457" fill="#94a3b8" font-size="8" text-anchor="middle">CRUD completo</text>
  <text x="190" y="472" fill="#94a3b8" font-size="8" text-anchor="middle">Categorias + severidad</text>
  <text x="190" y="485" fill="#fb7185" font-size="8" text-anchor="middle">/incidencias</text>

  <!-- Module 4: KPI Logisticos (bottom) -->
  <rect x="470" y="440" width="160" height="90" rx="8" fill="rgba(6, 78, 59, 0.3)" stroke="#34d399" stroke-width="1.5"/>
  <text x="550" y="465" fill="white" font-size="12" font-weight="700" text-anchor="middle">KPI Logisticos</text>
  <text x="550" y="482" fill="#94a3b8" font-size="9" text-anchor="middle">6 indicadores clave</text>
  <text x="550" y="497" fill="#94a3b8" font-size="8" text-anchor="middle">TEMA, TIR, OTIF</text>
  <text x="550" y="512" fill="#94a3b8" font-size="8" text-anchor="middle">Graficos Recharts</text>
  <text x="550" y="525" fill="#34d399" font-size="8" text-anchor="middle">/kpis</text>

  <!-- Module 5: Presupuestos (bottom-right) -->
  <rect x="820" y="400" width="180" height="90" rx="8" fill="rgba(120, 53, 15, 0.25)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="910" y="425" fill="white" font-size="12" font-weight="700" text-anchor="middle">Presupuestos</text>
  <text x="910" y="442" fill="#94a3b8" font-size="9" text-anchor="middle">Creacion + gestion</text>
  <text x="910" y="457" fill="#94a3b8" font-size="8" text-anchor="middle">Lineas + IVA (21%)</text>
  <text x="910" y="472" fill="#94a3b8" font-size="8" text-anchor="middle">Exportable + historico</text>
  <text x="910" y="485" fill="#fbbf24" font-size="8" text-anchor="middle">/presupuestos</text>

  <!-- Module 6: Formacion (right) -->
  <rect x="860" y="250" width="180" height="90" rx="8" fill="rgba(251, 146, 60, 0.25)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="950" y="275" fill="white" font-size="12" font-weight="700" text-anchor="middle">Formacion</text>
  <text x="950" y="292" fill="#94a3b8" font-size="9" text-anchor="middle">Matriz competencias</text>
  <text x="950" y="307" fill="#94a3b8" font-size="8" text-anchor="middle">Planes personalizados</text>
  <text x="950" y="322" fill="#94a3b8" font-size="8" text-anchor="middle">Niveles: basico→avanzado</text>
  <text x="950" y="335" fill="#fb923c" font-size="8" text-anchor="middle">/formacion</text>

  <!-- Module 7: SONEX (top-right) -->
  <rect x="820" y="110" width="180" height="90" rx="8" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="2"/>
  <text x="910" y="132" fill="white" font-size="12" font-weight="700" text-anchor="middle">SONEX</text>
  <text x="910" y="149" fill="#22d3ee" font-size="9" text-anchor="middle">Asistente IA</text>
  <text x="910" y="164" fill="#94a3b8" font-size="8" text-anchor="middle">Chat inteligente</text>
  <text x="910" y="179" fill="#94a3b8" font-size="8" text-anchor="middle">Multi-modelo (OpenRouter)</text>
  <text x="910" y="194" fill="#22d3ee" font-size="8" text-anchor="middle">/sonex</text>

  <!-- Connection lines from hub to modules -->
  <!-- Auth -->
  <line x1="550" y1="230" x2="550" y2="150" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Fichas Tecnicas -->
  <line x1="480" y1="270" x2="280" y2="175" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Sim Almacen -->
  <line x1="480" y1="300" x2="240" y2="300" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Incidencias -->
  <line x1="490" y1="340" x2="280" y2="430" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- KPIs -->
  <line x1="550" y1="370" x2="550" y2="440" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Presupuestos -->
  <line x1="620" y1="340" x2="820" y2="430" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Formacion -->
  <line x1="620" y1="300" x2="860" y2="300" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- SONEX -->
  <line x1="620" y1="270" x2="820" y2="175" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Data source indicator -->
  <rect x="420" y="560" width="260" height="70" rx="10" fill="rgba(76, 29, 149, 0.15)" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="550" y="582" fill="#a78bfa" font-size="10" font-weight="600" text-anchor="middle">FUENTE DE DATOS COMUN</text>
  <text x="550" y="600" fill="white" font-size="12" font-weight="700" text-anchor="middle">Cloud Firestore</text>
  <text x="550" y="618" fill="#94a3b8" font-size="9" text-anchor="middle">7 colecciones principales</text>

  <line x1="550" y1="530" x2="550" y2="560" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

  <text x="550" y="645" fill="#475569" font-size="9" text-anchor="middle">Proyectos Sonepar PFC | Modulos Funcionales | Mayo 2026</text>
</svg>