  <text x="360" y="170" fill="#94a3b8" font-size="9" text-anchor="middle">CSS Modules + Variables CSS</text>
  <text x="360" y="185" fill="#94a3b8" font-size="9" text-anchor="middle">Recharts + lucide-react</text>
  <text x="360" y="198" fill="#22d3ee" font-size="8" text-anchor="middle">7 Modulos Funcionales</text>

