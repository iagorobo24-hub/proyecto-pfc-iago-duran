  <text x="590" y="524" fill="#94a3b8" font-size="9" text-anchor="middle">200+ commits</text>
  <text x="590" y="535" fill="#fbbf24" font-size="8" text-anchor="middle">Repositorio principal</text>

  <rect x="720" y="465" width="180" height="75" rx="8" fill="rgba(120, 53, 15, 0.25)" stroke="#fbbf24" stroke-width="1"/>
  <text x="810" y="490" fill="white" font-size="12" font-weight="600" text-anchor="middle">Scraping</text>
  <text x="810" y="508" fill="#94a3b8" font-size="9" text-anchor="middle">sonepar.es</text>
  <text x="810" y="524" fill="#94a3b8" font-size="9" text-anchor="middle">Puppeteer + scripts</text>
  <text x="810" y="535" fill="#fbbf24" font-size="8" text-anchor="middle">Sync a Firestore</text>

