  <text x="985" y="153" fill="white" font-size="8" text-anchor="middle">Presupuestos</text>
  <rect x="535" y="170" width="90" height="28" rx="4" fill="rgba(8, 51, 68, 0.5)" stroke="#22d3ee" stroke-width="1"/>
  <text x="580" y="188" fill="white" font-size="8" text-anchor="middle">Formacion</text>
  <rect x="635" y="170" width="90" height="28" rx="4" fill="rgba(8, 51, 68, 0.5)" stroke="#22d3ee" stroke-width="1"/>
