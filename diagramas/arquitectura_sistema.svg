  <text x="50" y="100" fill="#22d3ee" font-size="11" font-weight="600">CAPA CLIENTE</text>

  <rect x="60" y="115" width="130" height="85" rx="8" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="125" y="142" fill="white" font-size="12" font-weight="600" text-anchor="middle">Navegador</text>
  <text x="125" y="158" fill="#94a3b8" font-size="9" text-anchor="middle">Chrome / Firefox</text>
  <text x="125" y="174" fill="#94a3b8" font-size="9" text-anchor="middle">Desktop / Mobile</text>
  <text x="125" y="190" fill="#22d3ee" font-size="8" text-anchor="middle">HTTPS</text>

  <rect x="250" y="110" width="220" height="95" rx="8" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
