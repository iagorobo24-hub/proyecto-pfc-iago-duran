<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#020617"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="phase1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:0.1"/>
    </linearGradient>
    <linearGradient id="phase2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0.1"/>
    </linearGradient>
    <linearGradient id="phase3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:0.1"/>
    </linearGradient>
    <linearGradient id="phase4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0.1"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="500" fill="url(#bg)"/>
  <rect width="1100" height="500" fill="url(#grid)"/>

  <text x="550" y="38" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle">Fases de Desarrollo — Proyectos Sonepar</text>
  <text x="550" y="56" fill="#94a3b8" font-size="11" text-anchor="middle">Timeline: Febrero 2026 → Mayo 2026 (3 meses)</text>

  <!-- Timeline axis -->
  <line x1="60" y1="90" x2="1060" y2="90" stroke="#334155" stroke-width="2"/>
  <!-- Month markers -->
  <rect x="60" y="80" width="2" height="20" fill="#64748b"/>
  <text x="61" y="115" fill="#94a3b8" font-size="9" text-anchor="middle">Feb</text>
  <rect x="310" y="80" width="2" height="20" fill="#64748b"/>
  <text x="311" y="115" fill="#94a3b8" font-size="9" text-anchor="middle">Mar</text>
  <rect x="560" y="80" width="2" height="20" fill="#64748b"/>
  <text x="561" y="115" fill="#94a3b8" font-size="9" text-anchor="middle">Abr</text>
  <rect x="810" y="80" width="2" height="20" fill="#64748b"/>
  <text x="811" y="115" fill="#94a3b8" font-size="9" text-anchor="middle">May</text>
  <rect x="1060" y="80" width="2" height="20" fill="#64748b"/>
  <text x="1050" y="115" fill="#94a3b8" font-size="9" text-anchor="middle">Jun</text>

  <!-- PHASE 1: Planning & Setup -->
  <rect x="60" y="130" width="250" height="90" rx="8" fill="url(#phase1)" stroke="#22d3ee" stroke-width="1.5"/>
  <circle cx="80" cy="145" r="8" fill="#22d3ee"/>
  <text x="80" y="149" fill="#020617" font-size="9" font-weight="700" text-anchor="middle">1</text>
  <text x="100" y="149" fill="white" font-size="12" font-weight="700">Planificacion</text>
  <text x="80" y="170" fill="#e2e8f0" font-size="9">Analisis de requisitos</text>
  <text x="80" y="185" fill="#e2e8f0" font-size="9">Definicion de alcance</text>
  <text x="80" y="200" fill="#e2e8f0" font-size="9">Setup Firebase + Vercel</text>
  <text x="80" y="215" fill="#22d3ee" font-size="8">2 semanas</text>

  <!-- PHASE 2: Core Development -->
  <rect x="60" y="240" width="500" height="90" rx="8" fill="url(#phase2)" stroke="#a78bfa" stroke-width="1.5"/>
  <circle cx="80" cy="255" r="8" fill="#a78bfa"/>
  <text x="80" y="259" fill="#020617" font-size="9" font-weight="700" text-anchor="middle">2</text>
  <text x="100" y="259" fill="white" font-size="12" font-weight="700">Desarrollo Core</text>
  <text x="80" y="280" fill="#e2e8f0" font-size="9">Fichas Tecnicas + Navegacion</text>
  <text x="80" y="295" fill="#e2e8f0" font-size="9">Simulador Almacen + Incidencias</text>
  <text x="80" y="310" fill="#e2e8f0" font-size="9">KPIs Logisticos + Presupuestos</text>
  <text x="80" y="325" fill="#a78bfa" font-size="8">6 semanas — la fase mas intensa</text>

  <!-- PHASE 3: AI Integration -->
  <rect x="310" y="350" width="500" height="90" rx="8" fill="url(#phase3)" stroke="#34d399" stroke-width="1.5"/>
  <circle cx="330" cy="365" r="8" fill="#34d399"/>
  <text x="330" y="369" fill="#020617" font-size="9" font-weight="700" text-anchor="middle">3</text>
  <text x="350" y="369" fill="white" font-size="12" font-weight="700">Integracion IA</text>
  <text x="330" y="390" fill="#e2e8f0" font-size="9">SONEX: Asistente inteligente</text>
  <text x="330" y="405" fill="#e2e8f0" font-size="9">OpenRouter + Claude + DeepSeek</text>
  <text x="330" y="420" fill="#e2e8f0" font-size="9">Formacion + Scraping sonepar.es</text>
  <text x="330" y="435" fill="#34d399" font-size="8">4 semanas</text>

  <!-- PHASE 4: Testing & Deploy -->
  <rect x="810" y="240" width="250" height="200" rx="8" fill="url(#phase4)" stroke="#fbbf24" stroke-width="1.5"/>
  <circle cx="830" cy="255" r="8" fill="#fbbf24"/>
  <text x="830" y="259" fill="#020617" font-size="9" font-weight="700" text-anchor="middle">4</text>
  <text x="850" y="259" fill="white" font-size="12" font-weight="700">Testing + Deploy</text>
  <text x="830" y="280" fill="#e2e8f0" font-size="9">Tests funcionales</text>
  <text x="830" y="295" fill="#e2e8f0" font-size="9">Optimizacion rendimiento</text>
  <text x="830" y="310" fill="#e2e8f0" font-size="9">Documentacion</text>
  <text x="830" y="325" fill="#e2e8f0" font-size="9">Lighthouse audit</text>
  <text x="830" y="340" fill="#e2e8f0" font-size="9">Deploy a produccion</text>
  <text x="830" y="355" fill="#e2e8f0" font-size="9">Memoria del proyecto</text>
  <text x="830" y="435" fill="#fbbf24" font-size="8">2 semanas</text>

  <!-- Overlap indicators -->
  <rect x="310" y="285" width="250" height="2" rx="1" fill="#a78bfa" opacity="0.5"/>
  <text x="435" y="283" fill="#a78bfa" font-size="7" text-anchor="middle">solapamiento</text>

  <!-- Progress bars at bottom -->
  <rect x="60" y="460" width="1000" height="25" rx="12" fill="rgba(30, 41, 59, 0.5)"/>
  <rect x="60" y="460" width="200" height="25" rx="12" fill="rgba(34, 211, 238, 0.3)"/>
  <rect x="260" y="460" width="400" height="25" rx="0" fill="rgba(167, 139, 250, 0.3)"/>
  <rect x="660" y="460" width="250" height="25" rx="0" fill="rgba(52, 211, 153, 0.3)"/>
  <rect x="910" y="460" width="150" height="25" rx="12" fill="rgba(251, 191, 36, 0.3)"/>
  <text x="160" y="477" fill="#22d3ee" font-size="8" text-anchor="middle">Plan.</text>
  <text x="460" y="477" fill="#a78bfa" font-size="8" text-anchor="middle">Desarrollo Core</text>
  <text x="785" y="477" fill="#34d399" font-size="8" text-anchor="middle">IA + Form.</text>
  <text x="985" y="477" fill="#fbbf24" font-size="8" text-anchor="middle">Test+Dep</text>

  <text x="550" y="495" fill="#475569" font-size="9" text-anchor="middle">Proyectos Sonepar PFC | Fases de Desarrollo | Mayo 2026</text>
</svg>