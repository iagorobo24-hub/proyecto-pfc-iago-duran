<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-v" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#020617"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="1100" height="680" fill="url(#bg)"/>
  <rect width="1100" height="680" fill="url(#grid)"/>

  <text x="550" y="38" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle">Modelo de Datos — Proyecto PFC</text>
  <text x="550" y="56" fill="#94a3b8" font-size="11" text-anchor="middle">Firestore: Colecciones y relaciones</text>

  <!-- productos collection -->
  <rect x="50" y="80" width="480" height="220" rx="10" fill="rgba(76, 29, 149, 0.1)" stroke="#a78bfa" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="70" y="100" fill="#a78bfa" font-size="11" font-weight="600">productos</text>

  <rect x="70" y="115" width="440" height="170" rx="8" fill="rgba(76, 29, 149, 0.3)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="290" y="138" fill="white" font-size="13" font-weight="700" text-anchor="middle">productos</text>
  <text x="290" y="155" fill="#a78bfa" font-size="9" text-anchor="middle">400,000+ documentos</text>

  <text x="90" y="178" fill="#e2e8f0" font-size="10">ref_fabricante</text>
  <text x="270" y="178" fill="#94a3b8" font-size="10">string — "ABCC123456"</text>
  <text x="90" y="196" fill="#e2e8f0" font-size="10">name</text>
  <text x="270" y="196" fill="#94a3b8" font-size="10">string — "Interruptor automatico 10A"</text>
  <text x="90" y="214" fill="#e2e8f0" font-size="10">familia / subfamilia / tipo</text>
  <text x="270" y="214" fill="#94a3b8" font-size="10">strings — jerarquia de navegacion</text>
  <text x="90" y="232" fill="#e2e8f0" font-size="10">marca / marca_id</text>
  <text x="270" y="232" fill="#94a3b8" font-size="10">string — "Schneider" / "schneider_electric"</text>
  <text x="90" y="250" fill="#e2e8f0" font-size="10">image / url / keywords</text>
  <text x="270" y="250" fill="#94a3b8" font-size="10">URLs + array para busqueda texto</text>
  <text x="90" y="268" fill="#e2e8f0" font-size="10">lastUpdated</text>
  <text x="270" y="268" fill="#94a3b8" font-size="10">timestamp</text>

  <!-- Indices badge -->
  <rect x="380" y="98" width="120" height="20" rx="10" fill="rgba(251, 146, 60, 0.2)" stroke="#fb923c" stroke-width="1"/>
  <text x="440" y="112" fill="#fb923c" font-size="8" text-anchor="middle">Indice: familia+marca+subfamilia</text>

  <!-- usuarios collection -->
  <rect x="590" y="80" width="460" height="200" rx="10" fill="rgba(8, 51, 68, 0.1)" stroke="#22d3ee" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="610" y="100" fill="#22d3ee" font-size="11" font-weight="600">usuarios</text>

  <rect x="610" y="115" width="420" height="150" rx="8" fill="rgba(8, 51, 68, 0.3)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="820" y="138" fill="white" font-size="13" font-weight="700" text-anchor="middle">usuarios</text>
  <text x="820" y="155" fill="#22d3ee" font-size="9" text-anchor="middle">Creado automatico en login</text>

  <text x="630" y="178" fill="#e2e8f0" font-size="10">uid</text>
  <text x="790" y="178" fill="#94a3b8" font-size="10">string — "google_123456789"</text>
  <text x="630" y="196" fill="#e2e8f0" font-size="10">email / displayName</text>
  <text x="790" y="196" fill="#94a3b8" font-size="10">strings del perfil Google</text>
  <text x="630" y="214" fill="#e2e8f0" font-size="10">role</text>
  <text x="790" y="214" fill="#94a3b8" font-size="10">"user" | "admin"</text>
  <text x="630" y="232" fill="#e2e8f0" font-size="10">preferencias</text>
  <text x="790" y="232" fill="#94a3b8" font-size="10">{ tema: "dark", idioma: "es" }</text>
  <text x="630" y="250" fill="#e2e8f0" font-size="10">photoURL / createdAt</text>
  <text x="790" y="250" fill="#94a3b8" font-size="10">URL + timestamp</text>

  <!-- presupuestos collection -->
  <rect x="50" y="330" width="480" height="180" rx="10" fill="rgba(6, 78, 59, 0.1)" stroke="#34d399" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="70" y="350" fill="#34d399" font-size="11" font-weight="600">presupuestos</text>

  <rect x="70" y="365" width="440" height="130" rx="8" fill="rgba(6, 78, 59, 0.3)" stroke="#34d399" stroke-width="1.5"/>
  <text x="290" y="388" fill="white" font-size="13" font-weight="700" text-anchor="middle">presupuestos</text>
  <text x="290" y="405" fill="#34d399" font-size="9" text-anchor="middle">Guardados por usuario</text>

  <text x="90" y="428" fill="#e2e8f0" font-size="10">usuario_id</text>
  <text x="270" y="428" fill="#94a3b8" font-size="10">FK → usuarios.uid</text>
  <text x="90" y="446" fill="#e2e8f0" font-size="10">items[]</text>
  <text x="270" y="446" fill="#94a3b8" font-size="10">Array de {ref, name, cantidad, precio}</text>
  <text x="90" y="464" fill="#e2e8f0" font-size="10">subtotal / iva / total</text>
  <text x="270" y="464" fill="#94a3b8" font-size="10">Calculo automatico con 21% IVA</text>
  <text x="90" y="482" fill="#e2e8f0" font-size="10">estado</text>
  <text x="270" y="482" fill="#94a3b8" font-size="10">"borrador" | "enviado" | "aceptado"</text>

  <!-- incidencias collection -->
  <rect x="590" y="330" width="460" height="180" rx="10" fill="rgba(136, 19, 55, 0.1)" stroke="#fb7185" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="610" y="350" fill="#fb7185" font-size="11" font-weight="600">incidencias</text>

  <rect x="610" y="365" width="420" height="130" rx="8" fill="rgba(136, 19, 55, 0.3)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="820" y="388" fill="white" font-size="13" font-weight="700" text-anchor="middle">incidencias</text>
  <text x="820" y="405" fill="#fb7185" font-size="9" text-anchor="middle">Registro de fallos industriales</text>

  <text x="630" y="428" fill="#e2e8f0" font-size="10">usuario_id</text>
  <text x="790" y="428" fill="#94a3b8" font-size="10">FK → usuarios.uid</text>
  <text x="630" y="446" fill="#e2e8f0" font-size="10">titulo / descripcion</text>
  <text x="790" y="446" fill="#94a3b8" font-size="10">strings</text>
  <text x="630" y="464" fill="#e2e8f0" font-size="10">categoria / severidad</text>
  <text x="790" y="464" fill="#94a3b8" font-size="10">"electrica" | "mecanica" | "software"</text>
  <text x="630" y="482" fill="#e2e8f0" font-size="10">estado</text>
  <text x="790" y="482" fill="#94a3b8" font-size="10">"abierta" | "en_progreso" | "resuelta"</text>

  <!-- formacion collection (smaller) -->
  <rect x="50" y="540" width="300" height="110" rx="10" fill="rgba(251, 146, 60, 0.1)" stroke="#fb923c" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="70" y="560" fill="#fb923c" font-size="11" font-weight="600">formacion</text>
  <rect x="70" y="572" width="260" height="65" rx="6" fill="rgba(251, 146, 60, 0.2)" stroke="#fb923c" stroke-width="1"/>
  <text x="200" y="592" fill="white" font-size="11" font-weight="600" text-anchor="middle">formacion</text>
  <text x="90" y="610" fill="#e2e8f0" font-size="9">empleado_id, competencias[], plan_formacion</text>
  <text x="90" y="626" fill="#e2e8f0" font-size="9">nivel: "basico" | "intermedio" | "avanzado"</text>

  <!-- kpis collection -->
  <rect x="400" y="540" width="300" height="110" rx="10" fill="rgba(120, 53, 15, 0.1)" stroke="#fbbf24" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="420" y="560" fill="#fbbf24" font-size="11" font-weight="600">kpis</text>
  <rect x="420" y="572" width="260" height="65" rx="6" fill="rgba(120, 53, 15, 0.2)" stroke="#fbbf24" stroke-width="1"/>
  <text x="550" y="592" fill="white" font-size="11" font-weight="600" text-anchor="middle">kpis</text>
  <text x="440" y="610" fill="#e2e8f0" font-size="9">6 indicadores: TEMA, TIR, OTIF...</text>
  <text x="440" y="626" fill="#e2e8f0" font-size="9">semaforo: verde / amarillo / rojo</text>

  <!-- sonex_conversations -->
  <rect x="750" y="540" width="300" height="110" rx="10" fill="rgba(8, 51, 68, 0.1)" stroke="#22d3ee" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="770" y="560" fill="#22d3ee" font-size="11" font-weight="600">sonex_conversaciones</text>
  <rect x="770" y="572" width="260" height="65" rx="6" fill="rgba(8, 51, 68, 0.25)" stroke="#22d3ee" stroke-width="1"/>
  <text x="900" y="592" fill="white" font-size="11" font-weight="600" text-anchor="middle">conversaciones</text>
  <text x="790" y="610" fill="#e2e8f0" font-size="9">usuario_id, mensajes[], modelo_ia</text>
  <text x="790" y="626" fill="#e2e8f0" font-size="9">tokens, timestamp</text>

  <!-- Relationship arrows -->
  <!-- usuarios -> presupuestos -->
  <line x1="820" y1="265" x2="820" y2="330" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <path d="M 610 300 Q 550 330 490 330" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="540" y="318" fill="#34d399" font-size="8" text-anchor="middle">1:N</text>

  <!-- usuarios -> incidencias -->
  <line x1="840" y1="265" x2="840" y2="330" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="855" y="318" fill="#fb7185" font-size="8">1:N</text>

  <!-- usuarios -> formacion -->
  <path d="M 700 265 Q 400 420 200 540" fill="none" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="420" y="430" fill="#fb923c" font-size="8">1:N</text>

  <!-- productos -> presupuestos (items) -->
  <line x1="290" y1="300" x2="290" y2="330" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="300" y="318" fill="#a78bfa" font-size="8">ref</text>

  <!-- Footer -->
  <text x="550" y="670" fill="#475569" font-size="9" text-anchor="middle">Proyecto PFC | Modelo Firestore | Mayo 2026</text>
</svg>