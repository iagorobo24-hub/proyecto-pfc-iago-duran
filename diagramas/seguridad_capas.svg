<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#020617"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="1100" height="700" fill="url(#bg)"/>
  <rect width="1100" height="700" fill="url(#grid)"/>

  <text x="550" y="38" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle">Seguridad por Capas — Proyectos Sonepar</text>
  <text x="550" y="56" fill="#94a3b8" font-size="11" text-anchor="middle">Modelo Defense-in-Depth | 5 capas de proteccion</text>

  <!-- LAYER 5 (outermost): Network/Transport -->
  <rect x="50" y="75" width="1000" height="580" rx="20" fill="rgba(8, 51, 68, 0.08)" stroke="#22d3ee" stroke-width="1" stroke-dasharray="10,5"/>
  <text x="70" y="98" fill="#22d3ee" font-size="12" font-weight="600">CAPA 5: RED Y TRANSPORTE</text>
  <rect x="950" y="82" width="90" height="25" rx="12" fill="rgba(34, 211, 238, 0.2)" stroke="#22d3ee" stroke-width="1"/>
  <text x="995" y="99" fill="#22d3ee" font-size="9" font-weight="600" text-anchor="middle">HTTPS/TLS</text>

  <!-- LAYER 4: Infrastructure -->
  <rect x="100" y="115" width="900" height="500" rx="18" fill="rgba(120, 53, 15, 0.08)" stroke="#fbbf24" stroke-width="1" stroke-dasharray="10,5"/>
  <text x="120" y="138" fill="#fbbf24" font-size="12" font-weight="600">CAPA 4: INFRAESTRUCTURA</text>
  <rect x="880" y="122" width="110" height="25" rx="12" fill="rgba(251, 191, 36, 0.2)" stroke="#fbbf24" stroke-width="1"/>
  <text x="935" y="139" fill="#fbbf24" font-size="9" font-weight="600" text-anchor="middle">Vercel Edge</text>

  <!-- Vercel details -->
  <rect x="120" y="155" width="200" height="45" rx="6" fill="rgba(120, 53, 15, 0.2)" stroke="#fbbf24" stroke-width="1"/>
  <text x="220" y="175" fill="white" font-size="10" font-weight="600" text-anchor="middle">Vercel Edge Network</text>
  <text x="220" y="192" fill="#94a3b8" font-size="8" text-anchor="middle">CDN global + SSL automatico</text>

  <rect x="340" y="155" width="200" height="45" rx="6" fill="rgba(120, 53, 15, 0.15)" stroke="#fbbf24" stroke-width="1"/>
  <text x="440" y="175" fill="white" font-size="10" font-weight="600" text-anchor="middle">Serverless Functions</text>
  <text x="440" y="192" fill="#94a3b8" font-size="8" text-anchor="middle">Sin servidor → sin ataque</text>

  <rect x="560" y="155" width="200" height="45" rx="6" fill="rgba(120, 53, 15, 0.15)" stroke="#fbbf24" stroke-width="1"/>
  <text x="660" y="175" fill="white" font-size="10" font-weight="600" text-anchor="middle">Environment Variables</text>
  <text x="660" y="192" fill="#94a3b8" font-size="8" text-anchor="middle">Secrets cifrados en Vercel</text>

  <rect x="780" y="155" width="200" height="45" rx="6" fill="rgba(120, 53, 15, 0.15)" stroke="#fbbf24" stroke-width="1"/>
  <text x="880" y="175" fill="white" font-size="10" font-weight="600" text-anchor="middle">CORS Headers</text>
  <text x="880" y="192" fill="#94a3b8" font-size="8" text-anchor="middle">Solo origenes permitidos</text>

  <!-- LAYER 3: Application -->
  <rect x="150" y="220" width="800" height="370" rx="16" fill="rgba(76, 29, 149, 0.08)" stroke="#a78bfa" stroke-width="1" stroke-dasharray="10,5"/>
  <text x="170" y="243" fill="#a78bfa" font-size="12" font-weight="600">CAPA 3: APLICACION</text>
  <rect x="830" y="227" width="110" height="25" rx="12" fill="rgba(167, 139, 250, 0.2)" stroke="#a78bfa" stroke-width="1"/>
  <text x="885" y="244" fill="#a78bfa" font-size="9" font-weight="600" text-anchor="middle">React SPA</text>

  <!-- App security measures -->
  <rect x="170" y="260" width="175" height="65" rx="6" fill="rgba(76, 29, 149, 0.2)" stroke="#a78bfa" stroke-width="1"/>
  <text x="257" y="280" fill="white" font-size="10" font-weight="600" text-anchor="middle">Auth Context</text>
  <text x="257" y="296" fill="#94a3b8" font-size="8" text-anchor="middle">Proteccion rutas</text>
  <text x="257" y="310" fill="#94a3b8" font-size="8" text-anchor="middle">Redirect a /login</text>

  <rect x="360" y="260" width="175" height="65" rx="6" fill="rgba(76, 29, 149, 0.15)" stroke="#a78bfa" stroke-width="1"/>
  <text x="447" y="280" fill="white" font-size="10" font-weight="600" text-anchor="middle">Input Sanitization</text>
  <text x="447" y="296" fill="#94a3b8" font-size="8" text-anchor="middle">Validacion de formularios</text>
  <text x="447" y="310" fill="#94a3b8" font-size="8" text-anchor="middle">No SQL injection</text>

  <rect x="550" y="260" width="175" height="65" rx="6" fill="rgba(76, 29, 149, 0.15)" stroke="#a78bfa" stroke-width="1"/>
  <text x="637" y="280" fill="white" font-size="10" font-weight="600" text-anchor="middle">Error Boundaries</text>
  <text x="637" y="296" fill="#94a3b8" font-size="8" text-anchor="middle">Captura errores React</text>
  <text x="637" y="310" fill="#94a3b8" font-size="8" text-anchor="middle">No expone stack traces</text>

  <rect x="740" y="260" width="190" height="65" rx="6" fill="rgba(76, 29, 149, 0.15)" stroke="#a78bfa" stroke-width="1"/>
  <text x="835" y="280" fill="white" font-size="10" font-weight="600" text-anchor="middle">Rate Limiting</text>
  <text x="835" y="296" fill="#94a3b8" font-size="8" text-anchor="middle">Limite peticiones API</text>
  <text x="835" y="310" fill="#94a3b8" font-size="8" text-anchor="middle">Proteccion contra abuso</text>

  <!-- LAYER 2: API/Data Access -->
  <rect x="200" y="340" width="700" height="230" rx="14" fill="rgba(251, 146, 60, 0.08)" stroke="#fb923c" stroke-width="1" stroke-dasharray="10,5"/>
  <text x="220" y="363" fill="#fb923c" font-size="12" font-weight="600">CAPA 2: API Y ACCESO A DATOS</text>
  <rect x="780" y="347" width="110" height="25" rx="12" fill="rgba(251, 146, 60, 0.2)" stroke="#fb923c" stroke-width="1"/>
  <text x="835" y="364" fill="#fb923c" font-size="9" font-weight="600" text-anchor="middle">Serverless</text>

  <!-- API security measures -->
  <rect x="220" y="380" width="200" height="70" rx="6" fill="rgba(251, 146, 60, 0.2)" stroke="#fb923c" stroke-width="1"/>
  <text x="320" y="400" fill="white" font-size="10" font-weight="600" text-anchor="middle">API Proxy</text>
  <text x="320" y="416" fill="#94a3b8" font-size="8" text-anchor="middle">Serverless function oculta</text>
  <text x="320" y="430" fill="#94a3b8" font-size="8" text-anchor="middle">API keys del cliente</text>
  <text x="320" y="444" fill="#fb923c" font-size="8" text-anchor="middle">/api/anthropic</text>

  <rect x="440" y="380" width="200" height="70" rx="6" fill="rgba(251, 146, 60, 0.15)" stroke="#fb923c" stroke-width="1"/>
  <text x="540" y="400" fill="white" font-size="10" font-weight="600" text-anchor="middle">Firestore Rules</text>
  <text x="540" y="416" fill="#94a3b8" font-size="8" text-anchor="middle">Solo usuarios autenticados</text>
  <text x="540" y="430" fill="#94a3b8" font-size="8" text-anchor="middle">Lectura publica: productos</text>
  <text x="540" y="444" fill="#94a3b8" font-size="8" text-anchor="middle">Escritura: solo propietario</text>

  <rect x="660" y="380" width="220" height="70" rx="6" fill="rgba(251, 146, 60, 0.15)" stroke="#fb923c" stroke-width="1"/>
  <text x="770" y="400" fill="white" font-size="10" font-weight="600" text-anchor="middle">OpenRouter Gateway</text>
  <text x="770" y="416" fill="#94a3b8" font-size="8" text-anchor="middle">Sin clave expuesta al browser</text>
  <text x="770" y="430" fill="#94a3b8" font-size="8" text-anchor="middle">Proxy serverless intermedio</text>
  <text x="770" y="444" fill="#94a3b8" font-size="8" text-anchor="middle">Fallback multi-modelo</text>

  <!-- LAYER 1 (innermost): Authentication -->
  <rect x="250" y="470" width="600" height="90" rx="12" fill="rgba(136, 19, 55, 0.15)" stroke="#fb7185" stroke-width="2"/>
  <text x="270" y="490" fill="#fb7185" font-size="12" font-weight="600">CAPA 1: AUTENTICACION (Nucleo)</text>

  <rect x="270" y="500" width="170" height="45" rx="6" fill="rgba(136, 19, 55, 0.3)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="355" y="518" fill="white" font-size="10" font-weight="600" text-anchor="middle">Firebase Auth</text>
  <text x="355" y="534" fill="#94a3b8" font-size="8" text-anchor="middle">Google OAuth 2.0</text>

  <rect x="455" y="500" width="170" height="45" rx="6" fill="rgba(136, 19, 55, 0.25)" stroke="#fb7185" stroke-width="1"/>
  <text x="540" y="518" fill="white" font-size="10" font-weight="600" text-anchor="middle">Session Token</text>
  <text x="540" y="534" fill="#94a3b8" font-size="8" text-anchor="middle">JWT + Refresh Token</text>

  <rect x="640" y="500" width="190" height="45" rx="6" fill="rgba(136, 19, 55, 0.2)" stroke="#fb7185" stroke-width="1"/>
  <text x="735" y="518" fill="white" font-size="10" font-weight="600" text-anchor="middle">Role-Based Access</text>
  <text x="735" y="534" fill="#94a3b8" font-size="8" text-anchor="middle">user / admin</text>

  <!-- Threat arrows from outside trying to get in -->
  <!-- Top threats -->
  <rect x="70" y="668" width="960" height="22" rx="4" fill="rgba(136, 19, 55, 0.1)" stroke="#fb7185" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="550" y="683" fill="#fb7185" font-size="9" text-anchor="middle">AMENAZAS MITIGADAS: MITM (TLS) | XSS (sanitization) | CSRF (SameSite) | Data breach (Firestore Rules) | API key leak (proxy) | Brute force (rate limit)</text>

  <!-- Legend at bottom -->
  <text x="550" y="660" fill="#475569" font-size="9" text-anchor="middle">Proyectos Sonepar PFC | Seguridad Defense-in-Depth | Mayo 2026</text>
</svg>