anchor="start" class="t h">Ficha de producto</text><text x="502" y="779" text-anchor="start" class="t b" fill="#64748B"><tspan x="502" dy="0">Referencia · nombre · marca · clasificación</tspan><tspan x="502" dy="22">imagen / precio / PDF cuando existen</tspan></text><rect x="85" y="695" width="330" height="190" fill="#FFFFFF" stroke="#C97318" stroke-width="1.7" rx="20"/><text x="110" y="728" text-anchor="start" class="t kicker">ACCIONES DESDE LA FICHA</text><rect x="110" y="750" width="270" height="36" fill="#FFF3E6" stroke="#C97318" stroke-width="1.5" rx="18"/><text x="245.0" y="774" text-anchor="middle" class="t small" fill="#142033" font-weight="700">Abrir PDF disponible</text><rect x="110" y="795" width="270" height="36" fill="#EAF8F0" stroke="#25805A" stroke-width="1.5" rx="18"/><text x="245.0" y="819" text-anchor="middle" class="t small" fill="#142033" font-weight="700">Enviar a Presupuestos</text><rect x="110" y="840" width="270" height="36" fill="#FFFFFF" stroke="#AAB8C6" stroke-width="1.5" rx="18"/><text x="245.0" y="864" text-anchor="middle" class="t small" fill="#142033" font-weight="700">Copiar referencia</text><line x1="480" y1="760" x2="423" y2="760" stroke="#90A4B7" stroke-width="2.2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1025" y="505" width="490" height="380" fill="#F2ECFF" stroke="#7656B5" stroke-width="2.2" rx="24" filter="url(#shadow)"/><text x="1055" y="540" text-anchor="start" class="t kicker">RAMA OPCIONAL DE IA</text><text x="1055" y="574" text-anchor="start" class="t h">Enriquecimiento auxiliar</text><rect x="1055" y="600" width="430" height="36" fill="#FFFFFF" stroke="#C9B9EC" stroke-width="1.5" rx="18"/><text x="1270.0" y="624" text-anchor="middle" class="t small" fill="#142033" font-weight="700">Datos reales de la ficha</text><line x1="1270" y1="636" x2="1270" y2="665" stroke="#90A4B7" stroke-width="2.2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1055" y="675" width="430" height="36" fill="#FFFFFF" stroke="#C9B9EC" stroke-width="1.5" rx="18"/><text x="1270.0" y="699" text-anchor="middle" class="t small" fill="#142033" font-weight="700">cliente IA → /api/ai</text><line x1="1270" y1="711" x2="1270" y2="740" stroke="#90A4B7" stroke-width="2.2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1055" y="750" width="430" height="36" fill="#FFFFFF" stroke="#C9B9EC" stroke-width="1.5" rx="18"/><text x="1270.0" y="774" text-anchor="middle" class="t small" fill="#142033" font-weight="700">parseAIJsonResponse</text><text x="1055" y="815" text-anchor="start" class="t b" fill="#64748B">La respuesta se muestra como contenido auxiliar.</text><text x="1055" y="842" text-anchor="start" class="t small" fill="#7A3E92"><tspan x="1055" dy="0">La aplicación NO demuestra automáticamente la veracidad</tspan><tspan x="1055" dy="19">de normas, especificaciones o consejos generados.</tspan></text><path d="M960 760 L1000 760 L1000 645 L1048 645" stroke="#90A4B7" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arrow)"/><text x="1000" y="918" text-anchor="middle" class="t b" fill="#64748B">Para decisiones reales: fabricante + normativa vigente + criterio profesional.</text></svg>