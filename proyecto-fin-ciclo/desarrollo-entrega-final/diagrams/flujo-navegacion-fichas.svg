<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <defs><style>
  .t{font-family:Arial,sans-serif;fill:#142638}.h{font-size:28px;font-weight:700}.sh{font-size:17px;font-weight:700}.b{font-size:14px}.muted{fill:#5a7082}.box{fill:#fff;stroke:#3d6e90;stroke-width:2}.data{fill:#effaf4;stroke:#2d825e;stroke-width:2}.ai{fill:#f7f2ff;stroke:#7656a1;stroke-width:2}.opt{fill:#f7fafc;stroke:#8aa0b2;stroke-width:1.5}.line{stroke:#6e8799;stroke-width:2;fill:none}.dash{stroke-dasharray:7 6}
  </style><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#6e8799"/></marker></defs>
  <rect width="1200" height="760" fill="#f5f8fa"/>
  <text x="600" y="48" text-anchor="middle" class="t h">Flujo actual de Fichas Técnicas</text>
  <text x="600" y="76" text-anchor="middle" class="t b muted">La profundidad de navegación depende de la taxonomía disponible; no existe un único árbol rígido</text>

  <rect x="70" y="120" width="260" height="105" rx="12" class="box"/>
  <text x="200" y="154" text-anchor="middle" class="t sh">Entrada directa</text>
  <text x="200" y="181" text-anchor="middle" class="t b">Buscar nombre / referencia</text>
  <text x="200" y="205" text-anchor="middle" class="t b">o abrir ?ref=...</text>

  <rect x="470" y="120" width="260" height="105" rx="12" class="box"/>
  <text x="600" y="154" text-anchor="middle" class="t sh">Navegación guiada</text>
  <text x="600" y="181" text-anchor="middle" class="t b">Familia / categoría · marca</text>
  <text x="600" y="205" text-anchor="middle" class="t b">subfamilia / tipo · gama cuando existe</text>

  <rect x="870" y="120" width="260" height="105" rx="12" class="opt"/>
  <text x="1000" y="154" text-anchor="middle" class="t sh">Contexto de interfaz</text>
  <text x="1000" y="181" text-anchor="middle" class="t b">Breadcrumb · filtros</text>
  <text x="1000" y="205" text-anchor="middle" class="t b">volver sin reiniciar flujo</text>

  <rect x="360" y="300" width="480" height="105" rx="14" class="data"/>
  <text x="600" y="334" text-anchor="middle" class="t sh">catalogService.ts</text>
  <text x="600" y="361" text-anchor="middle" class="t b">Consultas acotadas a Supabase · búsqueda · filtros · detalle · estadísticas</text>
  <text x="600" y="385" text-anchor="middle" class="t b muted">La aplicación utiliza los niveles que realmente existen en los datos</text>

  <line x1="200" y1="225" x2="430" y2="294" class="line" marker-end="url(#a)"/>
  <line x1="600" y1="225" x2="600" y2="292" class="line" marker-end="url(#a)"/>
  <line x1="1000" y1="225" x2="770" y2="294" class="line dash" marker-end="url(#a)"/>

  <rect x="120" y="475" width="340" height="120" rx="14" class="box"/>
  <text x="290" y="510" text-anchor="middle" class="t sh">Ficha de producto</text>
  <text x="290" y="537" text-anchor="middle" class="t b">Referencia · nombre · marca · clasificación</text>
  <text x="290" y="562" text-anchor="middle" class="t b">imagen / precio / PDF cuando existen</text>
  <text x="290" y="585" text-anchor="middle" class="t b">enlace a Presupuestos</text>

  <rect x="740" y="475" width="340" height="120" rx="14" class="ai"/>
  <text x="910" y="510" text-anchor="middle" class="t sh">Enriquecimiento opcional con IA</text>
  <text x="910" y="537" text-anchor="middle" class="t b">Contenido auxiliar generado a través de /api/ai</text>
  <text x="910" y="562" text-anchor="middle" class="t b">No sustituye catálogo, fabricante ni normativa</text>
  <text x="910" y="585" text-anchor="middle" class="t b">Datos críticos requieren fuente oficial</text>

  <line x1="505" y1="405" x2="340" y2="469" class="line" marker-end="url(#a)"/>
  <line x1="695" y1="405" x2="860" y2="469" class="line dash" marker-end="url(#a)"/>

  <rect x="160" y="650" width="880" height="62" rx="10" fill="#fff" stroke="#b7c6d1"/>
  <text x="600" y="678" text-anchor="middle" class="t sh">Evidencia cuantitativa separada</text>
  <text x="600" y="700" text-anchor="middle" class="t b muted">El número de productos, tiempos de consulta y cobertura de datos se miden en el entorno correspondiente; no son constantes del flujo.</text>
</svg>
