<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="title desc"><title id="title">Flujo de Fichas Técnicas</title><desc id="desc">Cómo pasa el usuario de una búsqueda o navegación a una ficha y qué papel tiene la IA.</desc><defs><style>
