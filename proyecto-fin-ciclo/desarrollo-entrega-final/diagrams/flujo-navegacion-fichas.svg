<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/><stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1000" height="480" fill="url(#bg2)"/>
  <text x="500" y="35" text-anchor="middle" fill="#38bdf8" font-size="20" font-weight="bold">Flujo de Navegación — Fichas Técnicas</text>

  <rect x="50" y="70" width="120" height="65" rx="8" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
  <text x="110" y="100" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">1. Familia</text>
  <text x="110" y="120" text-anchor="middle" fill="#bae6fd" font-size="10">CABLES, POTENCIA...</text>

  <rect x="220" y="70" width="120" height="65" rx="8" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
  <text x="280" y="100" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">2. Marca</text>
  <text x="280" y="120" text-anchor="middle" fill="#bae6fd" font-size="10">Schneider, ABB...</text>

  <rect x="390" y="70" width="120" height="65" rx="8" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
  <text x="450" y="100" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">3. Gama</text>
  <text x="450" y="120" text-anchor="middle" fill="#bae6fd" font-size="10">Acti9, Multi9...</text>

  <rect x="560" y="70" width="120" height="65" rx="8" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
  <text x="620" y="100" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">4. Tipo</text>
  <text x="620" y="120" text-anchor="middle" fill="#bae6fd" font-size="10">IC60, C60N...</text>

  <rect x="730" y="70" width="120" height="65" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
  <text x="790" y="100" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">5. Productos</text>
  <text x="790" y="120" text-anchor="middle" fill="#a7f3d0" font-size="10">Lista filtrada</text>

  <rect x="880" y="70" width="100" height="65" rx="8" fill="#3b0764" stroke="#c084fc" stroke-width="2"/>
  <text x="930" y="100" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">6. Ficha</text>
  <text x="930" y="120" text-anchor="middle" fill="#e9d5ff" font-size="10">Detalle+PDF</text>

  <line x1="170" y1="102" x2="215" y2="102" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="340" y1="102" x2="385" y2="102" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="510" y1="102" x2="555" y2="102" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="680" y1="102" x2="725" y2="102" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="850" y1="102" x2="875" y2="102" stroke="#34d399" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="50" y="180" width="930" height="80" rx="8" fill="#27272a" stroke="#fbbf24" stroke-width="2"/>
  <text x="515" y="210" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="bold">Backend: Consultas SQL a Supabase (PostgreSQL)</text>
  <text x="515" y="232" text-anchor="middle" fill="#fef3c7" font-size="11">SELECT DISTINCT familia FROM products  →  WHERE familia=$1 GROUP BY marca  →  ILIKE '%referencia%' LIMIT 1000</text>
  <text x="515" y="250" text-anchor="middle" fill="#fef3c7" font-size="11">Caché en memoria: marcas por categoría (TTL 5 min)  ·  Paginación 1000 records/página</text>

  <rect x="50" y="300" width="300" height="80" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
  <text x="200" y="330" text-anchor="middle" fill="#34d399" font-size="13" font-weight="bold">Búsqueda Directa</text>
  <text x="200" y="352" text-anchor="middle" fill="#a7f3d0" font-size="11">Buscar por referencia o nombre</text>
  <text x="200" y="370" text-anchor="middle" fill="#a7f3d0" font-size="11">ILIKE sobre ref_fabricante + name</text>

  <rect x="400" y="300" width="300" height="80" rx="8" fill="#1e1b4b" stroke="#a78bfa" stroke-width="2"/>
  <text x="550" y="330" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="bold">Ficha de Producto</text>
  <text x="550" y="352" text-anchor="middle" fill="#ddd6fe" font-size="11">Imagen + Precio + PDF datasheet</text>
  <text x="550" y="370" text-anchor="middle" fill="#ddd6fe" font-size="11">Botón: Añadir a presupuesto</text>

  <rect x="750" y="300" width="230" height="130" rx="8" fill="#3b0764" stroke="#c084fc" stroke-width="2"/>
  <text x="865" y="330" text-anchor="middle" fill="#c084fc" font-size="13" font-weight="bold">Optimizaciones</text>
  <text x="865" y="355" text-anchor="middle" fill="#e9d5ff" font-size="11">• Lazy loading chunks</text>
  <text x="865" y="375" text-anchor="middle" fill="#e9d5ff" font-size="11">• Caché marcas en memoria</text>
  <text x="865" y="395" text-anchor="middle" fill="#e9d5ff" font-size="11">• Paginación server-side</text>
  <text x="865" y="415" text-anchor="middle" fill="#e9d5ff" font-size="11">• 69 assets PWA precacheados</text>

  <line x1="200" y1="260" x2="200" y2="295" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr)"/>
  <line x1="550" y1="260" x2="550" y2="295" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr)"/>
</svg>