<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="title desc"><title id="title">Flujo de inteligencia artificial</title><desc id="desc">Qué controla la aplicación, qué delega a proveedores y dónde termina la evidencia.</desc><defs><style>
.t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#142033}
.title{font-size:34px;font-weight:750;letter-spacing:-.5px}
.subtitle{font-size:17px;fill:#64748B}
.kicker{font-size:13px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;fill:#64748B}
.h{font-size:21px;font-weight:720}
.sh{font-size:17px;font-weight:700}
.b{font-size:15px}
.small{font-size:13px}
.muted{fill:#64748B}
.line{stroke:#90A4B7;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dash{stroke-dasharray:8 7}
</style><marker id="arrow" markerWidth="11" markerHeight="11" refX="9.5" refY="4.5" orient="auto"><path d="M0,0 L0,9 L10,4.5 z" fill="#90A4B7"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity=".08"/></filter></defs><rect width="1600" height="1000" fill="#F7F9FC"/><text x="80" y="62" class="t title">Flujo de inteligencia artificial</text><text x="80" y="92" class="t subtitle">Qué controla la aplicación, qué delega a proveedores y dónde termina la evidencia.</text><rect x="1240" y="44" width="270" height="36" fill="#EEF2F7" stroke="#CBD5E1" stroke-width="1.5" rx="18"/><text x="1375.0" y="68" text-anchor="middle" class="t small" fill="#142033" font-weight="700">NO ES UN ÚNICO MODELO</text><rect x="70" y="150" width="280" height="145" fill="#EAF3FF" stroke="#2D6FB7" stroke-width="2" rx="20" filter="url(#shadow)"/><text x="92" y="180" text-anchor="start" class="t kicker">ORIGEN</text><text x="92" y="208" text-anchor="start" class="t h">Módulo de la app</text><text x="92" y="234" text-anchor="start" class="t b" fill="#64748B"><tspan x="92" dy="0">SONEX, Fichas, KPI,</tspan><tspan x="92" dy="22">Incidencias, Formación…</tspan></text><line x1="350" y1="222" x2="405" y2="222" stroke="#90A4B7" stroke-width="2.2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="415" y="150" width="300" height="145" fill="#EAF3FF" stroke="#2D6FB7" stroke-width="2" rx="20" filter="url(#shadow)"/><text x="437" y="180" text-anchor="start" class="t kicker">CLIENTE</text><text x="437" y="208" text-anchor="start" class="t h">Servicio / hook IA</text><text x="437" y="234" text-anchor="start" class="t b" fill="#64748B"><tspan x="437" dy="0">Construye mensajes, contexto</tspan><tspan x="437" dy="22">y modelo según el módulo</tspan></text><line x1="715" y1="222" x2="770" y2="222" stroke="#90A4B7" stroke-width="2.2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="780" y="125" width="420" height="195" fill="#F2ECFF" stroke="#7656B5" stroke-width="2" rx="20" filter="url(#shadow)"/><text x="802" y="155" text-anchor="start" class="t kicker">SERVIDOR</text><text x="802" y="183" text-anchor="start" class="t h">/api/ai · Vercel Function</text><text x="802" y="209" text-anchor="start" class="t b" fill="#64748B"><tspan x="802" dy="0">Método + CORS · rate limiting</tspan><tspan x="802" dy="22">mensajes/tamaño/tokens · allowlist</tspan><tspan x="802" dy="22">clave privada fuera del cliente</tspan></text><line x1="1200" y1="222" x2="1255" y2="222" stroke="#90A4B7" stroke-width="2.2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1265" y="150" width="270" height="145" fill="#F2ECFF" stroke="#7656B5" stroke-width="2" rx="20" filter="url(#shadow)"/><text x="1287" y="180" text-anchor="start" class="t kicker">PROVEEDOR</text><text x="1287" y="208" text-anchor="start" class="t h">OpenRouter / Groq</text><text x="1287" y="234" text-anchor="start" class="t b" fill="#64748B"><tspan x="1287" dy="0">Modelo solicitado</tspan><tspan x="1287" dy="22">+ fallbacks según error</tspan></text><path d="M1400 295 L1400 405 L1140 405" stroke="#90A4B7" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="780" y="355" width="350" height="130" fill="#F2ECFF" stroke="#7656B5" stroke-width="2" rx="20" filter="url(#shadow)"/><text x="802" y="385" text-anchor="start" class="t kicker">RESPUESTA</text><text x="802" y="413" text-anchor="start" class="t h">Stream o respuesta JSON</text><text x="802" y="439" text-anchor="start" class="t b" fill="#64748B"><tspan x="802" dy="0">Contenido generado por el modelo</tspan></text><line x1="780" y1="420" x2="720" y2="420" stroke="#90A4B7" stroke-width="2.2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="370" y="355" width="350" height="130" fill="#EAF3FF" stroke="#2D6FB7" stroke-width="2" rx="20" filter="url(#shadow)"/><text x="392" y="385" text-anchor="start" class="t kicker">CLIENTE</text><text x="392" y="413" text-anchor="start" class="t h">Tratamiento según módulo</text><text x="392" y="439" text-anchor="start" class="t b" fill="#64748B"><tspan x="392" dy="0">parser / Markdown / sanitización</tspan><tspan x="392" dy="22">y composición con datos reales</tspan></text><line x1="370" y1="420" x2="310" y2="420" stroke="#90A4B7" stroke-width="2.2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="70" y="355" width="230" height="130" fill="#EAF3FF" stroke="#2D6FB7" stroke-width="2" rx="20" filter="url(#shadow)"/><text x="92" y="385" text-anchor="start" class="t kicker">UI</text><text x="92" y="413" text-anchor="start" class="t h">Resultado al usuario</text><text x="92" y="439" text-anchor="start" class="t b" fill="#64748B"><tspan x="92" dy="0">texto, cards o</tspan><tspan x="92" dy="22">información auxiliar</tspan></text><rect x="70" y="570" width="1465" height="300" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.8" rx="24" filter="url(#shadow)"/><text x="100" y="606" text-anchor="start" class="t kicker">QUÉ SE PUEDE CONSIDERAR VERIFICADO</text><rect x="105" y="630" width="410" height="135" fill="#EAF8F0" stroke="#25805A" stroke-width="2" rx="20"/><text x="127" y="660" text-anchor="start" class="t kicker">CONTROL DE APLICACIÓN</text><text x="127" y="688" text-anchor="start" class="t h">Sí se controla</text><text x="127" y="714" text-anchor="start" class="t b" fill="#64748B"><tspan x="127" dy="0">entrada, límites, modelo permitido</tspan><tspan x="127" dy="22">y secreto del proveedor</tspan></text><rect x="595" y="630" width="410" height="135" fill="#EAF8F0" stroke="#25805A" stroke-width="2" rx="20"/><text x="617" y="660" text-anchor="start" class="t kicker">DATOS DE CATÁLOGO</text><text x="617" y="688" text-anchor="start" class="t h">Cuando el flujo los consulta</text><text x="617" y="714" text-anchor="start" class="t b" fill="#64748B"><tspan x="617" dy="0">SONEX valida referencias/cards</tspan><tspan x="617" dy="22">contra catálogo antes de enlazarlas</tspan></text><rect x="1085" y="630" width="410" height="135" fill="#FFF3E6" stroke="#C97318" stroke-width="2" rx="20"/><text x="1107" y="660" text-anchor="start" class="t kicker">CONTENIDO GENERADO</text><text x="1107" y="688" text-anchor="start" class="t h">No se vuelve verdad por el prompt</text><text x="1107" y="714" text-anchor="start" class="t b" fill="#64748B"><tspan x="1107" dy="0">normativa, specs y seguridad requieren</tspan><tspan x="1107" dy="22">fuente oficial / revisión humana</tspan></text><text x="105" y="815" text-anchor="start" class="t b" fill="#64748B">Importante: no todos los módulos usan el mismo modelo, parser o estrategia de validación. Este diagrama muestra el contrato común y sus límites.</text></svg>