  <rect x="260" y="330" width="170" height="70" rx="6" fill="#164e63" stroke="#67e8f9" stroke-width="1.5"/>
  <text x="345" y="360" text-anchor="middle" fill="#67e8f9" font-size="11" font-weight="bold" font-family="Segoe UI, Arial">SONEX</text>
  <text x="345" y="380" text-anchor="middle" fill="#cffafe" font-size="9" font-family="Segoe UI, Arial">IA streaming</text>
  
  <rect x="450" y="330" width="170" height="70" rx="6" fill="#164e63" stroke="#67e8f9" stroke-width="1.5"/>
  <text x="535" y="360" text-anchor="middle" fill="#67e8f9" font-size="11" font-weight="bold" font-family="Segoe UI, Arial">Presupuestos</text>
  <text x="535" y="380" text-anchor="middle" fill="#cffafe" font-size="9" font-family="Segoe UI, Arial">PDF export</text>
  
  <rect x="640" y="330" width="170" height="70" rx="6" fill="#164e63" stroke="#67e8f9" stroke-width="1.5"/>
  <text x="725" y="360" text-anchor="middle" fill="#67e8f9" font-size="11" font-weight="bold" font-family="Segoe UI, Arial">KPI Logístico</text>
  <text x="725" y="380" text-anchor="middle" fill="#cffafe" font-size="9" font-family="Segoe UI, Arial">Recharts</text>
  
  <rect x="70" y="420" width="170" height="70" rx="6" fill="#164e63" stroke="#67e8f9" stroke-width="1.5"/>
  <text x="155" y="450" text-anchor="middle" fill="#67e8f9" font-size="11" font-weight="bold" font-family="Segoe UI, Arial">Simulador</text>
  <text x="155" y="470" text-anchor="middle" fill="#cffafe" font-size="9" font-family="Segoe UI, Arial">4 etapas</text>
  
  <rect x="260" y="420" width="170" height="70" rx="6" fill="#164e63" stroke="#67e8f9" stroke-width="1.5"/>
  <text x="345" y="450" text-anchor="middle" fill="#67e8f9" font-size="11" font-weight="bold" font-family="Segoe UI, Arial">Incidencias</text>
  <text x="345" y="470" text-anchor="middle" fill="#cffafe" font-size="9" font-family="Segoe UI, Arial">AI diagnóstico</text>
  
  <rect x="450" y="420" width="170" height="70" rx="6" fill="#164e63" stroke="#67e8f9" stroke-width="1.5"/>
  <text x="535" y="450" text-anchor="middle" fill="#67e8f9" font-size="11" font-weight="bold" font-family="Segoe UI, Arial">Formación</text>
  <text x="535" y="470" text-anchor="middle" fill="#cffafe" font-size="9" font-family="Segoe UI, Arial">Matriz empleados</text>
  
  <!-- Stats box -->
  <rect x="640" y="420" width="290" height="70" rx="6" fill="#312e81" stroke="#a78bfa" stroke-width="2"/>
  <text x="785" y="450" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="bold" font-family="Segoe UI, Arial">Estadísticas de Componentes</text>
  <text x="785" y="470" text-anchor="middle" fill="#ddd6fe" font-size="10" font-family="Segoe UI, Arial">64 componentes | 2.525 líneas hooks | 15.721 LOC total</text>
  
  <!-- Arrows from App -->
  <line x1="350" y1="120" x2="330" y2="145" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="475" y1="120" x2="510" y2="145" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="600" y1="120" x2="690" y2="145" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="475" y1="120" x2="475" y2="275" stroke="#06b6d4" stroke-width="2"/>
</svg>
