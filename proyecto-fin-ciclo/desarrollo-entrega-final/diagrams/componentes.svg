<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <defs><style>
  .t{font-family:Arial,sans-serif;fill:#142638}.h{font-size:28px;font-weight:700}.sh{font-size:17px;font-weight:700}.b{font-size:14px}.muted{fill:#5a7082}.box{fill:#fff;stroke:#55758c;stroke-width:1.7}.core{fill:#eef7ff;stroke:#2e6f9e;stroke-width:2}.service{fill:#effaf4;stroke:#2b815c;stroke-width:2}.tool{fill:#faf7ff;stroke:#7c65a3;stroke-width:1.6}.line{stroke:#7890a1;stroke-width:2;fill:none}
  </style><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#7890a1"/></marker></defs>
  <rect width="1200" height="760" fill="#f4f7f9"/>
  <text x="600" y="48" text-anchor="middle" class="t h">Organización funcional del frontend</text>
  <text x="600" y="75" text-anchor="middle" class="t b muted">Inventario por responsabilidades, no por conteos de líneas o archivos</text>

  <rect x="420" y="105" width="360" height="82" rx="12" class="core"/>
  <text x="600" y="138" text-anchor="middle" class="t sh">App.jsx + React Router</text>
  <text x="600" y="164" text-anchor="middle" class="t b">Rutas públicas · ProtectedRoute · AppShell · lazy/Suspense</text>

  <line x1="600" y1="187" x2="600" y2="225" class="line" marker-end="url(#a)"/>

  <g>
    <rect x="65" y="235" width="250" height="105" rx="12" class="box"/>
    <text x="190" y="268" text-anchor="middle" class="t sh">Contextos y layout</text>
    <text x="190" y="293" text-anchor="middle" class="t b">Auth · Theme · Toast</text>
    <text x="190" y="317" text-anchor="middle" class="t b">Topbar · Sidebar · atajos</text>

    <rect x="345" y="235" width="250" height="105" rx="12" class="box"/>
    <text x="470" y="268" text-anchor="middle" class="t sh">Hooks</text>
    <text x="470" y="293" text-anchor="middle" class="t b">Navegación · persistencia</text>
    <text x="470" y="317" text-anchor="middle" class="t b">SONEX · simulador · analytics</text>

    <rect x="625" y="235" width="250" height="105" rx="12" class="service"/>
    <text x="750" y="268" text-anchor="middle" class="t sh">Servicios</text>
    <text x="750" y="293" text-anchor="middle" class="t b">catalogService.ts</text>
    <text x="750" y="317" text-anchor="middle" class="t b">cliente IA · orquestación SONEX</text>

    <rect x="905" y="235" width="230" height="105" rx="12" class="box"/>
    <text x="1020" y="268" text-anchor="middle" class="t sh">UI y utilidades</text>
    <text x="1020" y="293" text-anchor="middle" class="t b">Componentes reutilizables</text>
    <text x="1020" y="317" text-anchor="middle" class="t b">PDF · Markdown · storage</text>
  </g>

  <text x="600" y="395" text-anchor="middle" class="t sh">Pantallas funcionales bajo /app</text>
  <g>
    <rect x="50" y="425" width="130" height="78" rx="10" class="tool"/><text x="115" y="456" text-anchor="middle" class="t sh">Dashboard</text><text x="115" y="480" text-anchor="middle" class="t b">agregador</text>
    <rect x="190" y="425" width="130" height="78" rx="10" class="tool"/><text x="255" y="456" text-anchor="middle" class="t sh">Fichas</text><text x="255" y="480" text-anchor="middle" class="t b">catálogo</text>
    <rect x="330" y="425" width="130" height="78" rx="10" class="tool"/><text x="395" y="456" text-anchor="middle" class="t sh">Almacén</text><text x="395" y="480" text-anchor="middle" class="t b">5 etapas</text>
    <rect x="470" y="425" width="130" height="78" rx="10" class="tool"/><text x="535" y="456" text-anchor="middle" class="t sh">Incidencias</text><text x="535" y="480" text-anchor="middle" class="t b">seguimiento</text>
    <rect x="610" y="425" width="130" height="78" rx="10" class="tool"/><text x="675" y="456" text-anchor="middle" class="t sh">KPI</text><text x="675" y="480" text-anchor="middle" class="t b">6 indicadores</text>
    <rect x="750" y="425" width="130" height="78" rx="10" class="tool"/><text x="815" y="456" text-anchor="middle" class="t sh">Presup.</text><text x="815" y="480" text-anchor="middle" class="t b">subrutas + PDF</text>
    <rect x="890" y="425" width="130" height="78" rx="10" class="tool"/><text x="955" y="456" text-anchor="middle" class="t sh">Formación</text><text x="955" y="480" text-anchor="middle" class="t b">progreso</text>
    <rect x="1030" y="425" width="130" height="78" rx="10" class="tool"/><text x="1095" y="456" text-anchor="middle" class="t sh">SONEX</text><text x="1095" y="480" text-anchor="middle" class="t b">4 modos</text>
  </g>

  <rect x="105" y="575" width="990" height="105" rx="12" class="box"/>
  <text x="600" y="607" text-anchor="middle" class="t sh">Dependencias transversales</text>
  <text x="600" y="634" text-anchor="middle" class="t b">Supabase Auth + catálogo + user_data · localStorage como respaldo · /api/ai como gateway de modelos</text>
  <text x="600" y="660" text-anchor="middle" class="t b muted">Los nombres de archivos y cifras exactas de componentes/tests se obtienen del árbol del commit cuando sea necesario; no se congelan en este inventario.</text>
</svg>
