<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 550" width="950" height="550">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111827;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1f2937;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="compGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0891b2;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0e7490;stop-opacity:1"/>
    </linearGradient>
  </defs>
  
  <rect width="950" height="550" fill="url(#bgGrad3)"/>
  <text x="475" y="35" text-anchor="middle" fill="#22d3ee" font-size="20" font-weight="bold" font-family="Segoe UI, Arial">Organización de Componentes React</text>
  
  <!-- App level -->
  <rect x="350" y="60" width="250" height="60" rx="8" fill="url(#compGrad)" stroke="#22d3ee" stroke-width="2"/>
  <text x="475" y="95" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold" font-family="Segoe UI, Arial">App.jsx</text>
  
  <!-- Contexts -->
  <rect x="50" y="150" width="280" height="100" rx="8" fill="#1e3a5f" stroke="#38bdf8" stroke-width="2"/>
  <text x="190" y="180" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="bold" font-family="Segoe UI, Arial">Contextos (3)</text>
  <text x="190" y="205" fill="#bae6fd" font-size="10" font-family="Segoe UI, Arial">• AuthContext (86L) - Google OAuth</text>
  <text x="190" y="225" fill="#bae6fd" font-size="10" font-family="Segoe UI, Arial">• ThemeContext (128L) - light/dark</text>
  <text x="190" y="245" fill="#bae6fd" font-size="10" font-family="Segoe UI, Arial">• ToastContext (80L) - notificaciones</text>
  
  <!-- Hooks -->
  <rect x="370" y="150" width="280" height="100" rx="8" fill="#1e3a5f" stroke="#22d3ee" stroke-width="2"/>
  <text x="510" y="180" text-anchor="middle" fill="#22d3ee" font-size="13" font-weight="bold" font-family="Segoe UI, Arial">Hooks Personalizados (13)</text>
  <text x="510" y="205" fill="#bae6fd" font-size="10" font-family="Segoe UI, Arial">• useNavegacionFichas (715L) ⚠️</text>
  <text x="510" y="225" fill="#bae6fd" font-size="10" font-family="Segoe UI, Arial">• useProductTable (352L), useSonex (204L)</text>
  <text x="510" y="245" fill="#bae6fd" font-size="10" font-family="Segoe UI, Arial">• 10 hooks adicionales (50-200L cada uno)</text>
  
  <!-- Services -->
  <rect x="690" y="150" width="240" height="100" rx="8" fill="#1e3a5f" stroke="#34d399" stroke-width="2"/>
  <text x="810" y="180" text-anchor="middle" fill="#34d399" font-size="13" font-weight="bold" font-family="Segoe UI, Arial">Servicios (3)</text>
  <text x="810" y="205" fill="#a7f3d0" font-size="10" font-family="Segoe UI, Arial">• catalogService.ts (626L)</text>
  <text x="810" y="225" fill="#a7f3d0" font-size="10" font-family="Segoe UI, Arial">• anthropicService.ts (195L)</text>
  <text x="810" y="245" fill="#a7f3d0" font-size="10" font-family="Segoe UI, Arial">• brandLogoService.js (178L)</text>
  
  <!-- 7 Tools -->
  <rect x="50" y="280" width="880" height="140" rx="8" fill="#0c4a6e" stroke="#06b6d4" stroke-width="2"/>
  <text x="490" y="310" text-anchor="middle" fill="#06b6d4" font-size="14" font-weight="bold" font-family="Segoe UI, Arial">7 Herramientas Principales (src/tools/)</text>
  
  <!-- Tools grid -->
  <rect x="70" y="330" width="170" height="70" rx="6" fill="#164e63" stroke="#67e8f9" stroke-width="1.5"/>
