<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="title desc"><title id="title">Arquitectura del sistema</title><desc id="desc">Cómo se conectan interfaz, datos, persistencia e inteligencia artificial.</desc><defs><style>
.t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#142033}
.title{font-size:34px;font-weight:750;letter-spacing:-.5px}
.subtitle{font-size:17px;fill:#64748B}
.kicker{font-size:13px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;fill:#64748B}
.h{font-size:21px;font-weight:720}
.sh{font-size:17px;font-weight:700}
.b{font-size:15px}
.small{font-size:13px}
.muted{fill:#64748B}
.line{stroke:#90A4B7;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dash{stroke-dasharray:8 7}
</style><marker id="arrow" markerWidth="11" markerHeight="11" refX="9.5" refY="4.5" orient="auto"><path d="M0,0 L0,9 L10,4.5 z" fill="#90A4B7"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity=".08"/></filter></defs><rect width="1600" height="1000" fill="#F7F9FC"/><text x="80" y="62" class="t title">Arquitectura del sistema</text><text x="80" y="92" class="t subtitle">Cómo se conectan interfaz, datos, persistencia e inteligencia artificial.</text><rect x="1250" y="44" width="260" height="36" fill="#EEF2F7" stroke="#CBD5E1" stroke-width="1.5" rx="18"/><text x="1380.0" y="68" text-anchor="middle" class="t small" fill="#142033" font-weight="700">ESTADO ACTUAL · AGO 2026</text><rect x="80" y="140" width="240" height="115" fill="#EAF3FF" stroke="#2D6FB7" stroke-width="2" rx="20" filter="url(#shadow)"/><text x="102" y="170" text-anchor="start" class="t kicker">USUARIO</text><text x="102" y="198" text-anchor="start" class="t h">Navegador</text><text x="102" y="224" text-anchor="start" class="t b" fill="#64748B"><tspan x="102" dy="0">Landing y login públicos</tspan></text><rect x="390" y="125" width="820" height="175" fill="#EAF3FF" stroke="#2D6FB7" stroke-width="2.5" rx="24" filter="url(#shadow)"/><text x="420" y="158" text-anchor="start" class="t kicker">FRONTEND</text><text x="420" y="192" text-anchor="start" class="t h">React + Vite + React Router</text><rect x="420" y="218" width="220" height="36" fill="#FFFFFF" stroke="#B8CCE0" stroke-width="1.5" rx="18"/><text x="530.0" y="242" text-anchor="middle" class="t small" fill="#142033" font-weight="700">/ · Landing pública</text><rect x="655" y="218" width="185" height="36" fill="#FFFFFF" stroke="#B8CCE0" stroke-width="1.5" rx="18"/><text x="747.5" y="242" text-anchor="middle" class="t small" fill="#142033" font-weight="700">/login · público</text><rect x="855" y="218" width="315" height="36" fill="#FFFFFF" stroke="#2D6FB7" stroke-width="1.5" rx="18"/><text x="1012.5" y="242" text-anchor="middle" class="t small" fill="#142033" font-weight="700">/app · ProtectedRoute + AppShell</text><text x="420" y="278" text-anchor="start" class="t b" fill="#64748B">Dashboard Global + 7 herramientas · carga diferida · tema · navegación y atajos</text><line x1="320" y1="197" x2="382" y2="197" stroke="#90A4B7" stroke-width="2.2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="800" y1="300" x2="800" y2="350" stroke="#90A4B7" stroke-width="2.2" fill="none" stroke-linecap="round"/><line x1="350" y1="350" x2="1250" y2="350" stroke="#90A4B7" stroke-width="2.2" fill="none" stroke-linecap="round"/><line x1="350" y1="350" x2="350" y2="390" stroke="#90A4B7" stroke-width="2.2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="1250" y1="350" x2="1250" y2="390" stroke="#90A4B7" stroke-width="2.2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="80" y="395" width="670" height="355" fill="#EAF8F0" stroke="#25805A" stroke-width="2.5" rx="24" filter="url(#shadow)"/><text x="110" y="430" text-anchor="start" class="t kicker">DATOS Y PERSISTENCIA</text><text x="110" y="465" text-anchor="start" class="t h">Supabase es el backend actual</text><rect x="110" y="500" width="260" height="100" fill="#FFFFFF" stroke="#A8D8C0" stroke-width="1.5" rx="16"/><text x="130" y="530" text-anchor="start" class="t sh">Autenticación</text><text x="130" y="555" text-anchor="start" class="t b">Supabase Auth</text><text x="130" y="578" text-anchor="start" class="t small" fill="#64748B">protege el área /app</text><rect x="395" y="500" width="325" height="100" fill="#FFFFFF" stroke="#A8D8C0" stroke-width="1.5" rx="16"/><text x="415" y="530" text-anchor="start" class="t sh">Catálogo</text><text x="415" y="555" text-anchor="start" class="t b">catalogService.ts → PostgreSQL</text><text x="415" y="578" text-anchor="start" class="t small" fill="#64748B">products · brands · vistas/consultas</text><rect x="110" y="625" width="330" height="95" fill="#FFFFFF" stroke="#A8D8C0" stroke-width="1.5" rx="16"/><text x="130" y="655" text-anchor="start" class="t sh">Datos de usuario</text><text x="130" y="680" text-anchor="start" class="t b">useUserData → user_data</text><text x="130" y="703" text-anchor="start" class="t small" fill="#64748B">sincronización para usuario autenticado</text><rect x="465" y="625" width="255" height="95" fill="#FFFFFF" stroke="#A8D8C0" stroke-width="1.5" rx="16"/><text x="485" y="655" text-anchor="start" class="t sh">Respaldo local</text><text x="485" y="680" text-anchor="start" class="t b">localStorage</text><text x="485" y="703" text-anchor="start" class="t small" fill="#64748B">fallback / migración</text><rect x="850" y="395" width="670" height="355" fill="#F2ECFF" stroke="#7656B5" stroke-width="2.5" rx="24" filter="url(#shadow)"/><text x="880" y="430" text-anchor="start" class="t kicker">INTELIGENCIA ARTIFICIAL</text><text x="880" y="465" text-anchor="start" class="t h">Gateway serverless controlado</text><rect x="880" y="500" width="270" height="100" fill="#FFFFFF" stroke="#C9B9EC" stroke-width="1.5" rx="16"/><text x="900" y="530" text-anchor="start" class="t sh">Cliente</text><text x="900" y="555" text-anchor="start" class="t b">módulo / servicio IA</text><text x="900" y="578" text-anchor="start" class="t small" fill="#64748B">modelo según configuración</text><rect x="1175" y="500" width="315" height="100" fill="#FFFFFF" stroke="#C9B9EC" stroke-width="1.5" rx="16"/><text x="1195" y="530" text-anchor="start" class="t sh">/api/ai · Vercel Function</text><text x="1195" y="555" text-anchor="start" class="t b">CORS · rate limit · límites</text><text x="1195" y="578" text-anchor="start" class="t small" fill="#64748B">allowlist de modelos</text><line x1="1150" y1="550" x2="1168" y2="550" stroke="#90A4B7" stroke-width="2.2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="880" y="625" width="610" height="95" fill="#FFFFFF" stroke="#C9B9EC" stroke-width="1.5" rx="16"/><text x="900" y="655" text-anchor="start" class="t sh">Proveedores soportados</text><text x="900" y="682" text-anchor="start" class="t b">OpenRouter · Groq</text><text x="1120" y="682" text-anchor="start" class="t b" fill="#64748B">→ modelo solicitado / fallback según error</text><rect x="80" y="800" width="1440" height="120" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6" rx="20"/><text x="110" y="831" text-anchor="start" class="t kicker">LÍMITES Y CONTEXTO</text><text x="110" y="862" text-anchor="start" class="t sh">Firebase / Firestore</text><text x="290" y="862" text-anchor="start" class="t b" fill="#64748B">→ legado histórico, no camino principal actual</text><text x="110" y="892" text-anchor="start" class="t sh">Métricas variables</text><text x="290" y="892" text-anchor="start" class="t b" fill="#64748B">→ catálogo, tests, rendimiento, disponibilidad y coste requieren evidencia fechada; no son constantes de arquitectura.</text></svg>