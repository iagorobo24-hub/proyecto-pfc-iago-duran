<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef4f8"/></linearGradient>
    <style>
      .t{font-family:Arial,sans-serif;fill:#132238}.h{font-size:28px;font-weight:700}.sh{font-size:17px;font-weight:700}.b{font-size:14px}.muted{fill:#536b7e}.box{fill:#fff;stroke:#285e86;stroke-width:2}.data{fill:#f1fbf6;stroke:#27835d;stroke-width:2}.api{fill:#f7f2ff;stroke:#7654a8;stroke-width:2}.tool{fill:#f7fafc;stroke:#8aa0b2;stroke-width:1.5}.line{stroke:#607d92;stroke-width:2;fill:none}.dash{stroke-dasharray:7 6}.tag{font-size:12px;font-weight:700;fill:#285e86}
    </style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#607d92"/></marker>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <text x="600" y="48" text-anchor="middle" class="t h">Arquitectura actual del PFC</text>
  <text x="600" y="76" text-anchor="middle" class="t b muted">Snapshot documental · agosto de 2026 · sin métricas volátiles congeladas</text>

  <rect x="50" y="115" width="220" height="105" rx="14" class="box"/>
  <text x="160" y="148" text-anchor="middle" class="t sh">Navegador</text>
  <text x="160" y="176" text-anchor="middle" class="t b">/ · Landing pública</text>
  <text x="160" y="200" text-anchor="middle" class="t b">/login · acceso público</text>

  <rect x="340" y="105" width="500" height="135" rx="14" class="box"/>
  <text x="590" y="138" text-anchor="middle" class="t sh">SPA React + Vite + React Router</text>
  <text x="590" y="164" text-anchor="middle" class="t b">/app protegido por ProtectedRoute + AppShell</text>
  <text x="590" y="190" text-anchor="middle" class="t b">Dashboard Global + 7 herramientas funcionales</text>
  <text x="590" y="216" text-anchor="middle" class="t b muted">Carga diferida, tema, navegación común, toasts y atajos</text>

  <rect x="915" y="105" width="235" height="135" rx="14" class="data"/>
  <text x="1032" y="138" text-anchor="middle" class="t sh">Supabase</text>
  <text x="1032" y="164" text-anchor="middle" class="t b">Auth</text>
  <text x="1032" y="188" text-anchor="middle" class="t b">Catálogo PostgreSQL</text>
  <text x="1032" y="212" text-anchor="middle" class="t b">user_data</text>

  <line x1="270" y1="167" x2="332" y2="167" class="line" marker-end="url(#a)"/>
  <line x1="840" y1="167" x2="907" y2="167" class="line" marker-end="url(#a)"/>

  <text x="600" y="286" text-anchor="middle" class="t tag">ÁREA PRIVADA /app</text>
  <g>
    <rect x="55" y="310" width="125" height="70" rx="10" class="tool"/><text x="117" y="340" text-anchor="middle" class="t sh">Dashboard</text><text x="117" y="362" text-anchor="middle" class="t b">Global</text>
    <rect x="195" y="310" width="125" height="70" rx="10" class="tool"/><text x="257" y="340" text-anchor="middle" class="t sh">Fichas</text><text x="257" y="362" text-anchor="middle" class="t b">Técnicas</text>
    <rect x="335" y="310" width="125" height="70" rx="10" class="tool"/><text x="397" y="340" text-anchor="middle" class="t sh">Almacén</text><text x="397" y="362" text-anchor="middle" class="t b">5 etapas</text>
    <rect x="475" y="310" width="125" height="70" rx="10" class="tool"/><text x="537" y="340" text-anchor="middle" class="t sh">Incidencias</text><text x="537" y="362" text-anchor="middle" class="t b">IA + PDF</text>
    <rect x="615" y="310" width="125" height="70" rx="10" class="tool"/><text x="677" y="340" text-anchor="middle" class="t sh">KPI</text><text x="677" y="362" text-anchor="middle" class="t b">6 indicadores</text>
    <rect x="755" y="310" width="125" height="70" rx="10" class="tool"/><text x="817" y="340" text-anchor="middle" class="t sh">Presupuestos</text><text x="817" y="362" text-anchor="middle" class="t b">Catálogo + PDF</text>
    <rect x="895" y="310" width="125" height="70" rx="10" class="tool"/><text x="957" y="340" text-anchor="middle" class="t sh">Formación</text><text x="957" y="362" text-anchor="middle" class="t b">Progreso + IA</text>
    <rect x="1035" y="310" width="125" height="70" rx="10" class="tool"/><text x="1097" y="340" text-anchor="middle" class="t sh">SONEX</text><text x="1097" y="362" text-anchor="middle" class="t b">4 modos</text>
  </g>

  <rect x="80" y="445" width="440" height="135" rx="14" class="data"/>
  <text x="300" y="478" text-anchor="middle" class="t sh">Persistencia y catálogo</text>
  <text x="300" y="505" text-anchor="middle" class="t b">catalogService.ts → Supabase</text>
  <text x="300" y="530" text-anchor="middle" class="t b">useUserData → user_data + respaldo localStorage</text>
  <text x="300" y="555" text-anchor="middle" class="t b muted">Firebase se conserva solo como historia de arquitectura</text>

  <rect x="680" y="445" width="440" height="135" rx="14" class="api"/>
  <text x="900" y="478" text-anchor="middle" class="t sh">IA a través del gateway</text>
  <text x="900" y="505" text-anchor="middle" class="t b">Cliente → /api/ai → Vercel Function</text>
  <text x="900" y="530" text-anchor="middle" class="t b">OpenRouter / Groq · selección de modelo por módulo</text>
  <text x="900" y="555" text-anchor="middle" class="t b muted">CORS · rate limiting · allowlist · límites de entrada</text>

  <line x1="410" y1="380" x2="350" y2="438" class="line dash" marker-end="url(#a)"/>
  <line x1="785" y1="380" x2="845" y2="438" class="line dash" marker-end="url(#a)"/>

  <rect x="150" y="635" width="900" height="75" rx="12" fill="#fff" stroke="#b8c7d2"/>
  <text x="600" y="665" text-anchor="middle" class="t sh">Criterio de evidencia</text>
  <text x="600" y="691" text-anchor="middle" class="t b muted">Tests verdes, tamaño de catálogo, rendimiento, disponibilidad y coste requieren medición fechada; no forman parte de este diagrama como garantías.</text>
</svg>
