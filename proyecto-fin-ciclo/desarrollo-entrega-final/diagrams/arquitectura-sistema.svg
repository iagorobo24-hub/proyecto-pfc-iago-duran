<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/><stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="900" height="620" fill="url(#bg)"/>
  <text x="450" y="35" text-anchor="middle" fill="#38bdf8" font-size="22" font-weight="bold" font-family="Segoe UI">Arquitectura del Sistema — Proyecto PFC</text>

  <!-- USER -->
  <rect x="40" y="70" width="140" height="60" rx="10" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
  <text x="110" y="105" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">Usuario</text>

  <!-- REACT FRONTEND -->
  <rect x="250" y="60" width="220" height="100" rx="10" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
  <text x="360" y="90" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="bold">Frontend React 19</text>
  <text x="360" y="112" text-anchor="middle" fill="#bae6fd" font-size="11">Vite 7 · Router v7 · PWA</text>
  <text x="360" y="130" text-anchor="middle" fill="#bae6fd" font-size="11">Framer Motion · Recharts</text>
  <text x="360" y="148" text-anchor="middle" fill="#bae6fd" font-size="11">7 herramientas lazy-loaded</text>

  <!-- SUPABASE -->
  <rect x="530" y="60" width="180" height="100" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
  <text x="620" y="90" text-anchor="middle" fill="#34d399" font-size="14" font-weight="bold">Supabase</text>
  <text x="620" y="112" text-anchor="middle" fill="#a7f3d0" font-size="11">PostgreSQL</text>
  <text x="620" y="130" text-anchor="middle" fill="#a7f3d0" font-size="11">Row Level Security</text>
  <text x="620" y="148" text-anchor="middle" fill="#a7f3d0" font-size="11">Auth Google OAuth</text>

  <!-- VERCEL API -->
  <rect x="250" y="210" width="220" height="80" rx="10" fill="#1e1b4b" stroke="#a78bfa" stroke-width="2"/>
  <text x="360" y="240" text-anchor="middle" fill="#a78bfa" font-size="14" font-weight="bold">Vercel Serverless</text>
  <text x="360" y="262" text-anchor="middle" fill="#ddd6fe" font-size="11">/api/ai proxy · OpenRouter</text>
  <text x="360" y="280" text-anchor="middle" fill="#ddd6fe" font-size="11">Rate Limiting · CORS</text>

  <!-- OPENROUTER -->
  <rect x="530" y="210" width="180" height="80" rx="10" fill="#3b0764" stroke="#c084fc" stroke-width="2"/>
  <text x="620" y="240" text-anchor="middle" fill="#c084fc" font-size="14" font-weight="bold">OpenRouter</text>
  <text x="620" y="262" text-anchor="middle" fill="#e9d5ff" font-size="11">Claude · Gemini</text>
  <text x="620" y="280" text-anchor="middle" fill="#e9d5ff" font-size="11">GPT · Qwen</text>

  <!-- DATA FLOW -->
  <rect x="250" y="350" width="460" height="80" rx="10" fill="#27272a" stroke="#fbbf24" stroke-width="2"/>
  <text x="480" y="380" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="bold">Flujo de Datos</text>
  <text x="480" y="402" text-anchor="middle" fill="#fef3c7" font-size="11">Usuario → React → Supabase (SQL) → Productos</text>
  <text x="480" y="420" text-anchor="middle" fill="#fef3c7" font-size="11">Usuario → React → Vercel → OpenRouter → IA → Streaming → Botones</text>

  <!-- TOOLS -->
  <rect x="40" y="490" width="820" height="100" rx="10" fill="#171717" stroke="#f472b6" stroke-width="2"/>
  <text x="450" y="518" text-anchor="middle" fill="#f472b6" font-size="15" font-weight="bold">7 Herramientas</text>
  <text x="450" y="545" text-anchor="middle" fill="#fecdd3" font-size="12">Fichas Técnicas  ·  SONEX  ·  Presupuestos  ·  KPI  ·  Simulador  ·  Incidencias  ·  Formación</text>
  <text x="450" y="575" text-anchor="middle" fill="#fecdd3" font-size="11">400K+ productos  ·  IA streaming  ·  PDF export  ·  Recharts  ·  4 etapas  ·  CRUD+AI  ·  Matriz empleados</text>

  <!-- ARROWS -->
  <line x1="180" y1="100" x2="245" y2="100" stroke="#22d3ee" stroke-width="2"/>
  <text x="212" y="92" text-anchor="middle" fill="#64748b" font-size="9">HTTP</text>
  <line x1="470" y1="110" x2="525" y2="110" stroke="#34d399" stroke-width="2"/>
  <text x="497" y="102" text-anchor="middle" fill="#64748b" font-size="9">SQL queries</text>
  <line x1="360" y1="160" x2="360" y2="205" stroke="#a78bfa" stroke-width="2"/>
  <text x="375" y="185" text-anchor="middle" fill="#64748b" font-size="9">API calls</text>
  <line x1="470" y1="250" x2="525" y2="250" stroke="#c084fc" stroke-width="2"/>
  <text x="497" y="242" text-anchor="middle" fill="#64748b" font-size="9">LLM</text>
</svg>