<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" style="background:#1a1a2e">
  <text x="450" y="30" text-anchor="middle" fill="#eee" font-family="sans-serif" font-size="16" font-weight="bold">Modelo de Datos — Catálogo de Productos Eléctricos</text>

  <!-- Tabla Products -->
  <rect x="30" y="60" width="200" height="180" rx="8" fill="#2d2d44" stroke="#4ade80" stroke-width="2"/>
  <rect x="30" y="60" width="200" height="35" rx="8" fill="#4ade80"/>
  <text x="130" y="83" text-anchor="middle" fill="#1a1a2e" font-family="sans-serif" font-size="13" font-weight="bold">products</text>
  
  <text x="45" y="115" fill="#60a5fa" font-family="sans-serif" font-size="11">id (PK)</text>
  <text x="160" y="115" fill="#aaa" font-family="sans-serif" font-size="10">uuid</text>
  
  <text x="45" y="140" fill="#fff" font-family="sans-serif" font-size="11">ref_fabricante</text>
  <text x="160" y="140" fill="#aaa" font-family="sans-serif" font-size="10">text</text>
  
  <text x="45" y="165" fill="#fff" font-family="sans-serif" font-size="11">name</text>
  <text x="160" y="165" fill="#aaa" font-family="sans-serif" font-size="10">text</text>
  
  <text x="45" y="190" fill="#fff" font-family="sans-serif" font-size="11">familia</text>
  <text x="160" y="190" fill="#aaa" font-family="sans-serif" font-size="10">text</text>
  
  <text x="45" y="215" fill="#fff" font-family="sans-serif" font-size="11">subfamilia</text>
  <text x="160" y="215" fill="#aaa" font-family="sans-serif" font-size="10">text</text>

  <!-- Tabla Brands -->
  <rect x="280" y="60" width="180" height="130" rx="8" fill="#2d2d44" stroke="#f472b6" stroke-width="2"/>
  <rect x="280" y="60" width="180" height="35" rx="8" fill="#f472b6"/>
  <text x="370" y="83" text-anchor="middle" fill="#1a1a2e" font-family="sans-serif" font-size="13" font-weight="bold">brands</text>
  
  <text x="295" y="115" fill="#60a5fa" font-family="sans-serif" font-size="11">id (PK)</text>
  <text x="400" y="115" fill="#aaa" font-family="sans-serif" font-size="10">int</text>
  
  <text x="295" y="140" fill="#fff" font-family="sans-serif" font-size="11">name</text>
  <text x="400" y="140" fill="#aaa" font-family="sans-serif" font-size="10">text</text>
  
  <text x="295" y="165" fill="#fff" font-family="sans-serif" font-size="11">logo_url</text>
  <text x="400" y="165" fill="#aaa" font-family="sans-serif" font-size="10">text</text>

  <!-- Products -> Brands -->
  <path d="M230 130 L280 130" fill="none" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="255" y="120" text-anchor="middle" fill="#60a5fa" font-family="sans-serif" font-size="10">brand_id</text>

  <!-- Tabla Categories (familias únicas) -->
  <rect x="510" y="60" width="180" height="100" rx="8" fill="#2d2d44" stroke="#fbbf24" stroke-width="2"/>
  <rect x="510" y="60" width="180" height="35" rx="8" fill="#fbbf24"/>
  <text x="600" y="83" text-anchor="middle" fill="#1a1a2e" font-family="sans-serif" font-size="13" font-weight="bold">familias</text>
  
  <text x="525" y="115" fill="#60a5fa" font-family="sans-serif" font-size="11">id (PK)</text>
  <text x="630" y="115" fill="#aaa" font-family="sans-serif" font-size="10">int</text>
  
  <text x="525" y="140" fill="#fff" font-family="sans-serif" font-size="11">name</text>
  <text x="630" y="140" fill="#aaa" font-family="sans-serif" font-size="10">text</text>

  <!-- Products -> Categories -->
  <path d="M230 160 L510 160" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="370" y="150" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="10">familia</text>

  <!-- Jerarquía de clasificación -->
  <text x="450" y="300" text-anchor="middle" fill="#eee" font-family="sans-serif" font-size="14" font-weight="bold">Jerarquía de Clasificación de Productos</text>

  <!-- Nivel 1: Familia -->
  <rect x="30" y="320" width="150" height="50" rx="8" fill="#4ade80" opacity="0.2" stroke="#4ade80" stroke-width="2"/>
  <text x="105" y="345" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="12" font-weight="bold">FAMILIA</text>
  <text x="105" y="358" text-anchor="middle" fill="#aaa" font-family="sans-serif" font-size="9">ej: Distribución de potencia</text>

  <!-- Nivel 2: Marca -->
  <rect x="200" y="320" width="150" height="50" rx="8" fill="#f472b6" opacity="0.2" stroke="#f472b6" stroke-width="2"/>
  <text x="275" y="345" text-anchor="middle" fill="#f472b6" font-family="sans-serif" font-size="12" font-weight="bold">MARCA</text>
  <text x="275" y="358" text-anchor="middle" fill="#aaa" font-family="sans-serif" font-size="9">ej: Schneider, Legrand</text>

  <!-- Nivel 3: Gama -->
  <rect x="370" y="320" width="150" height="50" rx="8" fill="#fbbf24" opacity="0.2" stroke="#fbbf24" stroke-width="2"/>
  <text x="445" y="345" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="bold">GAMA</text>
  <text x="445" y="358" text-anchor="middle" fill="#aaa" font-family="sans-serif" font-size="9">ej: Interruptores automáticos</text>

  <!-- Nivel 4: Subfamilia -->
  <rect x="540" y="320" width="150" height="50" rx="8" fill="#60a5fa" opacity="0.2" stroke="#60a5fa" stroke-width="2"/>
  <text x="615" y="345" text-anchor="middle" fill="#60a5fa" font-family="sans-serif" font-size="12" font-weight="bold">SUBFAMILIA</text>
  <text x="615" y="358" text-anchor="middle" fill="#aaa" font-family="sans-serif" font-size="9">ej: CARRIL DIN</text>

  <!-- Nivel 5: Tipo -->
  <rect x="710" y="320" width="150" height="50" rx="8" fill="#a78bfa" opacity="0.2" stroke="#a78bfa" stroke-width="2"/>
  <text x="785" y="345" text-anchor="middle" fill="#a78bfa" font-family="sans-serif" font-size="12" font-weight="bold">TIPO</text>
  <text x="785" y="358" text-anchor="middle" fill="#aaa" font-family="sans-serif" font-size="9">ej: Magnetotérmico</text>

  <!-- Flechas de jerarquía -->
  <path d="M180 345 L200 345" fill="none" stroke="#fff" stroke-width="2" marker-end="url(#arrow2)"/>
  <path d="M350 345 L370 345" fill="none" stroke="#fff" stroke-width="2" marker-end="url(#arrow2)"/>
  <path d="M520 345 L540 345" fill="none" stroke="#fff" stroke-width="2" marker-end="url(#arrow2)"/>
  <path d="M690 345 L710 345" fill="none" stroke="#fff" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Subgama (fuera de flujo principal) -->
  <rect x="540" y="400" width="150" height="40" rx="8" fill="#fb923c" opacity="0.2" stroke="#fb923c" stroke-width="1"/>
  <text x="615" y="425" text-anchor="middle" fill="#fb923c" font-family="sans-serif" font-size="11">SUBGAMA</text>
  <path d="M565 370 L565 400" fill="none" stroke="#fb923c" stroke-width="1" stroke-dasharray="4"/>
  <text x="575" y="388" fill="#aaa" font-family="sans-serif" font-size="9">variante</text>

  <!-- Leyenda -->
  <rect x="30" y="460" width="840" height="35" rx="5" fill="#2d2d44"/>
  <text x="450" y="482" text-anchor="middle" fill="#aaa" font-family="sans-serif" font-size="11">4,689 productos únicos | 7 familias | 63 subfamilias | 107 gamas | 324 subgamas</text>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#60a5fa"/>
    </marker>
  </defs>
</svg>