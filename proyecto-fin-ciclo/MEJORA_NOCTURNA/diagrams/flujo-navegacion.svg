<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" style="background:#1a1a2e">
  <text x="450" y="30" text-anchor="middle" fill="#eee" font-family="sans-serif" font-size="16" font-weight="bold">Flujo de Navegación — Fichas Técnicas + Presupuestos</text>

  <!-- USUARIO -->
  <ellipse cx="450" cy="65" rx="60" ry="25" fill="#4ade80" opacity="0.3" stroke="#4ade80" stroke-width="2"/>
  <text x="450" y="70" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="12" font-weight="bold">Usuario</text>

  <!-- STEP 1: Familia -->
  <rect x="350" y="110" width="200" height="50" rx="8" fill="#2d2d44" stroke="#4ade80" stroke-width="2"/>
  <text x="450" y="130" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="bold">1. Seleccionar Familia</text>
  <text x="450" y="148" text-anchor="middle" fill="#aaa" font-family="sans-serif" font-size="10">Ej: "Distribución de potencia"</text>

  <path d="M450 90 L450 110" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- STEP 2: Marca -->
  <rect x="350" y="180" width="200" height="50" rx="8" fill="#2d2d44" stroke="#f472b6" stroke-width="2"/>
  <text x="450" y="200" text-anchor="middle" fill="#f472b6" font-family="sans-serif" font-size="11" font-weight="bold">2. Filtrar por Marca</text>
  <text x="450" y="218" text-anchor="middle" fill="#aaa" font-family="sans-serif" font-size="10">Schneider | Legrand | Siemens</text>

  <path d="M450 160 L450 180" fill="none" stroke="#f472b6" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- STEP 3: Gama -->
  <rect x="350" y="250" width="200" height="50" rx="8" fill="#2d2d44" stroke="#fbbf24" stroke-width="2"/>
  <text x="450" y="270" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="bold">3. Elegir Gama</text>
  <text x="450" y="288" text-anchor="middle" fill="#aaa" font-family="sans-serif" font-size="10">107 gamas disponibles</text>

  <path d="M450 230 L450 250" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- STEP 4: Subfamilia -->
  <rect x="350" y="320" width="200" height="50" rx="8" fill="#2d2d44" stroke="#60a5fa" stroke-width="2"/>
  <text x="450" y="340" text-anchor="middle" fill="#60a5fa" font-family="sans-serif" font-size="11" font-weight="bold">4. Seleccionar Subfamilia</text>
  <text x="450" y="358" text-anchor="middle" fill="#aaa" font-family="sans-serif" font-size="10">Ej: "CARRIL DIN", "Cajas para FV"</text>

  <path d="M450 300 L450 320" fill="none" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- STEP 5: Tipo -->
  <rect x="350" y="390" width="200" height="50" rx="8" fill="#2d2d44" stroke="#a78bfa" stroke-width="2"/>
  <text x="450" y="410" text-anchor="middle" fill="#a78bfa" font-family="sans-serif" font-size="11" font-weight="bold">5. Definir Tipo</text>
  <text x="450" y="428" text-anchor="middle" fill="#aaa" font-family="sans-serif" font-size="10">Interruptor | Seccionador | Protección</text>

  <path d="M450 370 L450 390" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- STEP 6: Subgama -->
  <rect x="350" y="460" width="200" height="50" rx="8" fill="#2d2d44" stroke="#fb923c" stroke-width="2"/>
  <text x="450" y="480" text-anchor="middle" fill="#fb923c" font-family="sans-serif" font-size="11" font-weight="bold">6. Subgama (opcional)</text>
  <text x="450" y="498" text-anchor="middle" fill="#aaa" font-family="sans-serif" font-size="10">324 subgamas | filtros adicionales</text>

  <path d="M450 440 L450 460" fill="none" stroke="#fb923c" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- RESULTADO: Referencias -->
  <rect x="620" y="250" width="200" height="100" rx="8" fill="#4ade80" opacity="0.2" stroke="#4ade80" stroke-width="2"/>
  <text x="720" y="275" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="12" font-weight="bold">REFERENCIAS</text>
  <text x="720" y="295" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="11">Productos filtrados</text>
  <text x="720" y="315" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="11">+ detalle completo</text>
  <text x="720" y="335" text-anchor="middle" fill="#aaa" font-family="sans-serif" font-size="10">Fichas técnicas | Añadir a presupuesto</text>

  <path d="M550 310 L620 300" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- RAMIFICACIÓN: Presupuestos -->
  <rect x="100" y="310" width="180" height="70" rx="8" fill="#f472b6" opacity="0.2" stroke="#f472b6" stroke-width="2"/>
  <text x="190" y="335" text-anchor="middle" fill="#f472b6" font-family="sans-serif" font-size="11" font-weight="bold">MÓDULO</text>
  <text x="190" y="352" text-anchor="middle" fill="#f472b6" font-family="sans-serif" font-size="11" font-weight="bold">PRESUPUESTOS</text>
  <text x="190" y="370" text-anchor="middle" fill="#aaa" font-family="sans-serif" font-size="10">Wizard multistep</text>

  <path d="M350 330 L280 340" fill="none" stroke="#f472b6" stroke-width="2" stroke-dasharray="5" marker-end="url(#arrow3)"/>

  <!-- Leyenda lateral -->
  <rect x="30" y="120" width="130" height="200" rx="8" fill="#2d2d44" opacity="0.5"/>
  <text x="95" y="145" text-anchor="middle" fill="#eee" font-family="sans-serif" font-size="10" font-weight="bold">LEYENDA</text>
  
  <rect x="40" y="160" width="12" height="12" fill="#4ade80"/>
  <text x="58" y="170" fill="#aaa" font-family="sans-serif" font-size="9">Filtro principal</text>
  
  <rect x="40" y="180" width="12" height="12" fill="#f472b6"/>
  <text x="58" y="190" fill="#aaa" font-family="sans-serif" font-size="9">Filtro secundario</text>
  
  <rect x="40" y="200" width="12" height="12" fill="#fbbf24"/>
  <text x="58" y="210" fill="#aaa" font-family="sans-serif" font-size="9">Filtro de producto</text>
  
  <rect x="40" y="220" width="12" height="12" fill="#60a5fa"/>
  <text x="58" y="230" fill="#aaa" font-family="sans-serif" font-size="9">Selección</text>
  
  <rect x="40" y="240" width="12" height="12" fill="#a78bfa"/>
  <text x="58" y="250" fill="#aaa" font-family="sans-serif" font-size="9">Refinamiento</text>
  
  <rect x="40" y="260" width="12" height="12" fill="#4ade80" opacity="0.5"/>
  <text x="58" y="270" fill="#aaa" font-family="sans-serif" font-size="9">Resultado</text>
  
  <line x1="40" y1="290" x2="90" y2="290" stroke="#f472b6" stroke-width="2" stroke-dasharray="5"/>
  <text x="58" y="300" fill="#aaa" font-family="sans-serif" font-size="9">Conexión opcional</text>

  <!-- Stats -->
  <rect x="30" y="400" width="130" height="120" rx="8" fill="#2d2d44" opacity="0.5"/>
  <text x="95" y="420" text-anchor="middle" fill="#eee" font-family="sans-serif" font-size="10" font-weight="bold">ESTADÍSTICAS</text>
  <text x="95" y="445" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="9">7 familias</text>
  <text x="95" y="462" text-anchor="middle" fill="#f472b6" font-family="sans-serif" font-size="9">3 marcas</text>
  <text x="95" y="479" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="9">107 gamas</text>
  <text x="95" y="496" text-anchor="middle" fill="#60a5fa" font-family="sans-serif" font-size="9">63 subfamilias</text>
  <text x="95" y="513" text-anchor="middle" fill="#a78bfa" font-family="sans-serif" font-size="9">23 tipos</text>

  <defs>
    <marker id="arrow3" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#60a5fa"/>
    </marker>
  </defs>
</svg>