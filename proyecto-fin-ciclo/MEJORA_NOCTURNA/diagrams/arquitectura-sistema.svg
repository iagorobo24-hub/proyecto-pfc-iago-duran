<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" style="background:#1a1a2e">
  <!-- Título -->
  <text x="450" y="35" text-anchor="middle" fill="#eee" font-family="sans-serif" font-size="18" font-weight="bold">Arquitectura del Sistema — PFC Sonepar</text>

  <!-- Leyenda de colores -->
  <rect x="20" y="550" width="15" height="15" fill="#4ade80"/>
  <text x="42" y="562" fill="#aaa" font-family="sans-serif" font-size="11">Cliente Frontend</text>
  <rect x="150" y="550" width="15" height="15" fill="#60a5fa"/>
  <text x="172" y="562" fill="#aaa" font-family="sans-serif" font-size="11">Servicios Cloud</text>
  <rect x="280" y="550" width="15" height="15" fill="#f472b6"/>
  <text x="302" y="562" fill="#aaa" font-family="sans-serif" font-size="11">APIs Externas</text>
  <rect x="400" y="550" width="15" height="15" fill="#fbbf24"/>
  <text x="422" y="562" fill="#aaa" font-family="sans-serif" font-size="11">Base de Datos</text>

  <!-- BROWSER -->
  <rect x="300" y="70" width="300" height="140" rx="10" fill="#2d2d44" stroke="#4ade80" stroke-width="2"/>
  <text x="450" y="95" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="14" font-weight="bold">Navegador (Cliente)</text>

  <!-- Componentes dentro del navegador -->
  <rect x="315" y="105" width="80" height="40" rx="5" fill="#3d3d5c"/>
  <text x="355" y="130" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="11">React 18</text>

  <rect x="410" y="105" width="80" height="40" rx="5" fill="#3d3d5c"/>
  <text x="450" y="130" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="11">Vite</text>

  <rect x="505" y="105" width="80" height="40" rx="5" fill="#3d3d5c"/>
  <text x="545" y="130" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="11">React Router</text>

  <rect x="315" y="155" width="110" height="40" rx="5" fill="#3d3d5c"/>
  <text x="370" y="180" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="11">Context API</text>

  <rect x="440" y="155" width="145" height="40" rx="5" fill="#3d3d5c"/>
  <text x="512" y="180" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="11">Supabase Client</text>

  <!-- Flechas del navegador a servicios -->
  <path d="M380 210 L380 240 L200 240" fill="none" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M450 210 L450 240" fill="none" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M520 210 L520 240 L700 240" fill="none" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- SUPABASE -->
  <rect x="60" y="255" width="180" height="150" rx="10" fill="#2d2d44" stroke="#fbbf24" stroke-width="2"/>
  <text x="150" y="280" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="14" font-weight="bold">Supabase</text>

  <rect x="75" y="290" width="150" height="30" rx="5" fill="#3d3d5c"/>
  <text x="150" y="310" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="11">PostgreSQL</text>

  <rect x="75" y="325" width="150" height="30" rx="5" fill="#3d3d5c"/>
  <text x="150" y="345" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="11">Auth (JWT)</text>

  <rect x="75" y="360" width="150" height="30" rx="5" fill="#3d3d5c"/>
  <text x="150" y="380" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="11">Realtime</text>

  <!-- API GATEWAY -->
  <rect x="350" y="255" width="200" height="70" rx="10" fill="#2d2d44" stroke="#60a5fa" stroke-width="2"/>
  <text x="450" y="280" text-anchor="middle" fill="#60a5fa" font-family="sans-serif" font-size="14" font-weight="bold">Vercel (Edge Runtime)</text>

  <rect x="365" y="290" width="170" height="25" rx="5" fill="#3d3d5c"/>
  <text x="450" y="308" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="11">Serverless Functions</text>

  <!-- OPENROUTER -->
  <rect x="620" y="255" width="180" height="90" rx="10" fill="#2d2d44" stroke="#f472b6" stroke-width="2"/>
  <text x="710" y="280" text-anchor="middle" fill="#f472b6" font-family="sans-serif" font-size="14" font-weight="bold">OpenRouter API</text>

  <rect x="635" y="290" width="150" height="25" rx="5" fill="#3d3d5c"/>
  <text x="710" y="308" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="11">Claude / GPT / Gemini</text>

  <rect x="635" y="320" width="150" height="25" rx="5" fill="#3d3d5c"/>
  <text x="710" y="338" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="11">Streaming SSE</text>

  <!-- Flechas entre servicios -->
  <path d="M240 330 L350 290" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M550 290 L620 290" fill="none" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STORAGE (localStorage) -->
  <rect x="60" y="430" width="180" height="60" rx="10" fill="#2d2d44" stroke="#4ade80" stroke-width="2"/>
  <text x="150" y="455" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="12" font-weight="bold">LocalStorage</text>
  <text x="150" y="475" text-anchor="middle" fill="#aaa" font-family="sans-serif" font-size="10">Fallback offline</text>

  <path d="M150 405 L150 430" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ANTHROPIC API (alternativa directa) -->
  <rect x="620" y="370" width="180" height="60" rx="10" fill="#2d2d44" stroke="#f472b6" stroke-width="2"/>
  <text x="710" y="395" text-anchor="middle" fill="#f472b6" font-family="sans-serif" font-size="12" font-weight="bold">Anthropic API</text>
  <text x="710" y="415" text-anchor="middle" fill="#aaa" font-family="sans-serif" font-size="10">Uso directo (backup)</text>

  <!-- Definición de flecha -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#60a5fa"/>
    </marker>
  </defs>
</svg>